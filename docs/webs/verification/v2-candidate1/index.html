</style></head><body><div id="root"></div><noscript><main style="max-width:48rem;margin:4rem auto;padding:1rem"><h1>Moriarty Webs</h1><p>This interactive guide needs JavaScript for its explorer and arithmetic worksheet.</p><p>Moriarty Webs let a Cardano financial application bring the required proofs to a transition. The consuming contract names every Strand it needs — the payment arithmetic, the fee, the duties that continue — and its validator accepts the transition only when each one is present and matches a statement rebuilt from the transaction itself. Owners sign exact limits on what can leave their accounts, fees stay separate from repayment, and what is still owed stays on the record. Webs are built for Cardano developers writing financial dapps, and for the wallets, asset issuers and transaction builders that work alongside them.</p><h2>Implementation status</h2><p>Moriarty Webs is a concept under review. Supplied records include one current-Rust invoice-partial Groth16 roundtrip (S07) and seven finite local compiled-C2-wrapper cases (S08: one acceptance and six mutation rejections), with a single-party test setup whose operator can forge proofs and caller-fabricated proof contexts. No on-chain transaction is recorded. Only a conditional lowering argument is adopted. V2 consumer descriptions on this page are Opus readings of unadopted, uncompiled source, not observed behavior or exact-source correspondence to those runs. General Web integration, genuine intent authorization, onchain settlement and all-family compatibility remain unestablished in this packet. Local VM cost is not ledger cost. Every interactive example on this page is an illustration.</p></main></noscript><script>(()=>{var Mh=Object.create;var ac=Object.defineProperty;var xh=Object.getOwnPropertyDescriptor;var Hh=Object.getOwnPropertyNames;var Lh=Object.getPrototypeOf,qh=Object.prototype.hasOwnProperty;var Kt=(e,t)=>()=>{try{return t||e((t={exports:{}}).exports,t),t.exports}catch(a){throw t=0 d effort are recorded only by the wrapper.",scope:"Security and evidence wording for the local Webs and Strands explanatory page draft only, used together with SECURITY-ERRATA.json ERR-01 to ERR-28. Not security approval, mechanism adoption, implementation, product release, publication approval, operator readiness or native authority.",review:"Newly authored copy. It is not a review of any page. Fresh review of the actual integrated page remains pending: a nonauthor Muse editorial/result review and a separate Opus review of the exact final security wording. Any changed byte needs fresh applicable review.",sourceReadingCaveat:"Every V2 consumer or claim-policy description here is an Opus source-level reading of unadopted, uncompiled Aiken/Rust files. It is not observed compiled behavior and not exact-source evidence for the recorded S07 roundtrip or the S08 compiled C2-wrapper (K10) runs: no supplied record pins those binaries or compiled bytes to the reviewed source. The four-piece settle implementation and byte/type helpers were not supplied to the reviewer; four-piece reuse rests on S09 and source comments.",integrationRule:"Nonsecurity authors may quote a card, rule or string exactly, with its assumptions, evidenceStage and sourceRefs adjacent or one disclosure away, or omit it. Do not drop an assumption, upgrade a stage, merge cards into a broader claim, or add a security conclusion. New security wording needs an Opus referral.",stageLabels:{RECORDED:"Recorded observation in a supplied S07/S08 record; local and scoped, not ledger acceptance.",V2_SOURCE_READING:"Opus reading of unadopted, uncompiled V2 source; not observed behavior.",CONDITIONAL_ARGUMENT:"A01/A02 conditional source-design argument only (T1 modulo premises).",PROPOSED:"Design proposal; not adopted, implemented or enforced.",OPEN:"Unresolved; nothing in this packet closes it.",PREMISE:"Cardano ledger rule assumed; not contained in the sources.",ILLUSTRATION:"Page-local example data or state; no proof, transaction or ledger meaning."}},maturity:{title:"Current maturity",body:"Moriarty Webs is a concept under review. Supplied records include one current-Rust invoice-partial Groth16 roundtrip (S07) and seven finite local compiled-C2-wrapper cases (S08: one acceptance and six mutation rejections), with a single-party test setup whose operator can forge proofs and caller-fabricated proof contexts. No on-chain transaction is recorded. Only a conditional lowering argument is adopted. V2 consumer descriptions on this page are Opus readings of unadopted, uncompiled source, not observed behavior or exact-source correspondence to those runs. General Web integration, genuine intent authorization, onchain settlement and all-family compatibility remain unestablished in this packet. Local VM cost is not ledger cost. Every interactive example on this page is an illustration.",sourceRefs:["S07 /scope","S08 /predicate","S08 /scopeLimitations","A01 /scope","A03 \xA70","ERR-05","ERR-17","ERR-19","ERR-20","CL-11","CL-12","CL-13","CL-14","CL-15"]},cards:[{id:"proof-meaning",title:"What a verifying proof shows",body:"Under an honest setup and Groth16 knowledge soundness, a verifying proof shows the prover knew a witness satisfying the compiled constraints for its two public inputs. Linking those inputs to statement bytes additionally rests on the in-circuit BLAKE2b gadget and on BLAKE2b collision resistance. It never authenticates those bytes. A proof over supplied values does not make them an authenticated ledger fact or a true outside observation. A concrete execution proof, a universal property certificate and an authenticated ledger claim are different assertions; the latter two are not established Strand kinds.",assumptions:["The current class-0 test setup is forgeable by its operator, so no production security claim follows.","Whether the compiled constraints and verifying key match your source is OPEN (T3: compiled circuit/VK and BLAKE2b gadget correspondence).","Outside facts keep their named issuer, predicate, authentication path and freshness limits.","Reference-input reads are PROPOSED: the validator must read the datum itself and authenticate its origin. PREMISE: being unspent at application shows presence only, with no exclusivity or history. A validity interval neither dates nor authenticates a datum.","SEC06-P06 PROPOSED; still needs real-context stale-sequence and expired-attestation cases, changed-reference-datum and forged-origin negatives, N5/N7\u2013N9 at V, and a separately scoped real-context proof."],evidenceStage:"Assumption-bound Groth16 meaning; T3 OPEN; reference-input path PROPOSED",sourceRefs:["ERR-16","ERR-17","ERR-01","ERR-11","CL-27","CL-45","CL-49","S07 /limitations/universalPropertyCertificate","S07 /limitations/class0ControllerCanForge","SEC06-P06 PROPOSED"]},{id:"recorded-evidence",title:"What has actually been recorded",body:"Evidence layers (DEMO ONLY): H ordinary host tests captured (K4H, S04; fresh actual-result review pending) | N 1 local roundtrip (S07) | V 1 local C2 wrapper, 7 cases (S08) | P none. One genuine proof was accepted by a compiled C2 wrapper in a local VM with fabricated context (S08); no on-chain transaction is recorded. S08 /cases/0 records cpu 2222340191 and mem 205312 for the whole compiled C2 Issue evaluation, including its pairing; it is neither an isolated verification cost nor ledger ExUnits, fee or transaction fit. Every recorded proof context in the supplied sources is caller-fabricated (S07, S08).",assumptions:["No supplied record pins the recorded runs to the later V2 source bytes; V2 readings elsewhere on this page are not evidence about these runs.","Named runtime guards behind the six S08 rejections were not instrumented.","All 20 retained S02 families are requirements, not supported ports. The 235 catalogue IDs are pre-dedup review identifiers, not accepted or proven properties; the original 42/52 lists remain unrecovered.","Moriarty's broader target remains Midnight ZKIRv3 and native proof infrastructure; Cardano is an additional experiment and does not qualify Midnight. Preview-first and later Preprod end-to-end acceptance remain required for claimed targets.","SEC06-P08 PROPOSED (developer trust report); still needs a DEMO ONLY S07/S08 report with these qualified layers, fresh nonsecurity wording review and fresh security review. No new evidence is inferred from this layer wording."],evidenceStage:"RECORDED (local, scoped)",sourceRefs:["ERR-18","ERR-17","ERR-05","ERR-19","CL-11","CL-12","CL-13","CL-14","CL-31","CL-32","CL-33","CL-34","S07 /scope","S08 /cases","S08 /scopeLimitations","SEC06-P08 PROPOSED"]},{id:"setup-keys",title:"Setup and keys",body:"The current test setup can be forged by its operator; whether the verifying key matches the compiled relation is OPEN. Groth16 needs a separate setup per distinct compiled circuit (R1CS matrices), not per logical predicate. In the current Rust source the predicate digest is a circuit constant, so each distinct relation identity is a distinct circuit. The required total setup count is unknown; predicate, catalogue and family counts do not determine it. No production ceremony is recorded in the supplied sources, and none is proposed here.",assumptions:["A future universal circuit or Midnight's universal PLONK/KZG SRS would change the comparison (PROPOSED or target-specific).","V2 SOURCE READING: catalogue VK digests are fixed at genesis and carried unchanged, and Close requires zero balances and duties, so any key change needs a PROPOSED key migration action that carries residual duties.","Intent revocation (Revoke) advances seq; it is not key migration.","SEC06-P07 PROPOSED; still needs an old-VK-refused-after-migration negative, a setup-class report and independent review of any future ceremony."],evidenceStage:"RECORDED limitation (forgeable test setup); V2 SOURCE READING; total setup count UNKNOWN",sourceRefs:["ERR-14","ERR-28","ERR-17","CL-14","CL-32","CL-43","SEC06-P07 PROPOSED"]},{id:"binding-chain",title:"What ties a Strand to its step",body:"V2 SOURCE READING: tag, family, predicate_digest, shape_digest and body_len are circuit constants; the context fields vk_digest through intents_digest (bytes 112..339, including claimant_vkh) are free booleanized witness bits that are hashed, not interpreted. The consumer, not the circuit, ties those fields to the transaction: the settling validator rebuilds each statement from the transaction and the spent thread state, so a claim made for another thread step, catalogue, claimant or intent set does not match. Claimant binding happens at consumption, not at issuance: C2 Issue does not compare the claimant with the statement, so a mismatched envelope can be minted but cannot settle. This source-level binding is separate from T3, which stays OPEN.",assumptions:["The class-0 setup operator can forge a proof for any digest and any claimant. The claimant is prover-chosen bytes, not an authenticated prover identity.","Builders select claim inputs; the ledger spends each claim once (PREMISE). A copied proof can be re-issued with the same claimant and a new expiry; only that claimant can release it.","Catalogue program_hash and source_hash are visible, covered by catalogue_digest and signed in every owner intent. No on-chain check links them to predicate_digest or vk_digest: that link is a CATALOGUE-AUTHOR ASSERTION and VK-to-matrix is OPEN. Exact predicate-digest field coverage depends on identity.rs, which the reviewer did not read.","The statement's network byte is declared by the catalogue and not compared with the executing ledger; separation across networks rests on outref uniqueness (PREMISE).","SEC06-P03 and SEC06-P04 PROPOSED; still need competing-claimant and same-claimant duplicate negatives, second-party source\u2192relation\u2192predicate reproduction, refusal-list coverage, N5/N7\u2013N9, a T3 method, reviewed T2/T3 and F07\u2013F10, a non-test setup, and cross-network replay analysis if the network byte is relied on."],evidenceStage:"V2 SOURCE READING (unadopted, uncompiled); T3 OPEN",sourceRefs:["ERR-02","ERR-03","ERR-13","ERR-07","ERR-16","CL-36","CL-39","CL-40","CL-45","CL-46","SEC06-P03 PROPOSED","SEC06-P04 PROPOSED"]},{id:"issuance-route",title:"Where proofs are checked: the issuance route",body:"In the reviewed V2 source, each proof is checked when its claim is issued: the C2 claim policy checks a Groth16 proof and mints one claim output per Issue transaction. Claims must exist before settlement. The settlement transaction consumes them, recomputes each statement and compares it with the digest checked at issuance; it does not verify the proof again. Each consumed claim needs its claimant's signature on the settlement transaction and the burn of its token. Structurally, n required Strands mean n Issue transactions plus one settlement, excluding one-time genesis and any post-expiry reclaim. These counts are readings of uncompiled source, not measurements.",assumptions:["Each claim output locks min-ADA from issuance until settlement or claimant-signed reclaim after the claimant-chosen expiry. Several envelopes can exist per statement digest.","Safe but not live: any catalogue account may Revoke (advancing seq), and a competing settlement may spend the outref, orphaning issued claims and locking their value until expiry. Earlier reclaim is PROPOSED (OPEN).","Batch issuance needs a C2 change (PROPOSED). Proof-at-consumption is a different PROPOSED design needing a new redeemer and in-settlement pairings, with size and budget unmeasured. Mempool chaining is a node premise outside the sources.","V2 source already refuses two claims for one consumed outref; S09's role-level refusal is an unadopted proposal and not deduplication permission.","Owner intents are signed before proving; claimant settlement signatures are a later, distinct event. Proof collection or claim-output creation executes no effect.","Still needs orphan-after-Revoke, competing-settlement and post-expiry reclaim cases, and a qualified complete-path measurement of both verification placements."],evidenceStage:"V2 SOURCE READING (structural); not observed onchain",sourceRefs:["ERR-04","ERR-06","ERR-07","ERR-12","ERR-25","ERR-26","ERR-27","CL-02","CL-30","CL-47","CL-50","SEC06-P04 PROPOSED"]},{id:"web-completeness",title:"Complete and incomplete Webs",body:"PROPOSED: a Web settles only when every Strand its contract requires is present. An incomplete Web has no authority over thread effects. On the issuance route its already-issued claim outputs exist on-chain, lock value, and remain releasable only by their claimant. In the first proposed supported profile, the consumer refuses universal property certificates, authenticated-history claims, private handoff, recursive parents and multiparent joins as UNSUPPORTED; they remain required Web tracks, each needing its own trust path and evidence before any profile accepts it.",assumptions:["All-or-nothing acceptance and a consumer-derived required set are PROPOSED; no Web consumer, second genuine relation or general cardinality exists in this packet.","Depicting several Strand roles does not establish separate relations or producers. A whole-execution proof may cover several claim specifications; naming source expressions fee or liability does not create independent proof producers.","A01 adopts only conditional T1: the all-role conjunction equals whole-action Core over one decoded body, modulo premise G including output well-formedness, a covering WebPlan, whole-action compilation first and the same field. There is no implementation, no T2, no T3 and no full WP migration (F07\u2013F10); builder reliance is not permitted.","OPEN: whether a consumer can enforce a fully authorized partial financial step that carries every proof that step requires, distinct from a missing proof.","SEC06-P01 and SEC06-P02 PROPOSED; still need N1/N12 and unknown-class refusal, a report-level test that an incomplete set never renders as accepted, N1\u2013N4/N6/N11/N14 at H/V, a wrong-action-index case, a required-set display, separate future-profile designs and fresh security review of reused V2 mechanisms."],evidenceStage:"PROPOSED; CONDITIONAL_ARGUMENT for T1 only",sourceRefs:["ERR-01","ERR-15","ERR-10","ERR-20","ERR-27","CL-03","CL-15","CL-16","CL-17","CL-21","CL-37","CL-38","SEC06-P01 PROPOSED","SEC06-P02 PROPOSED"]},{id:"effects-authority",title:"Effects, allocation and authority",body:"V2 SOURCE READING: owner intents sign per-asset gross_cap, fee_cap, net_floor and liability_cap for a beneficiary, a validity window, nonce = seq and the target predicate, VK and shape digests. Duties change only through recorded accruals and discharges, and a thread with a nonzero duty cannot close. The thread datum carries the complete custody snapshot, which custody must equal exactly. Actual output allocation is the consuming validator's job; a proof can attest arithmetic only over values the validator recomputes. A profile chooses either strict one-output-per-obligation or a consumer-recomputed amount partition that admits coalesced payments, with every obligation allocated exactly once.",assumptions:["The source strict-output rule covers redeemers of one S2 script hash only, not other scripts or S2 versions. No input value may count toward two obligations; ledger single-spend alone is not a value partition.","Circuit-level NotBound/TouchedOnly limits remain. A general multi-UTxO authenticated frame, role sets, cross-script allocation and partial-completion rules are PROPOSED.","No genuine intent signature is observed in the supplied proof records.","A supplied approved=true is consented to by the effect-derived required signers, and by a listed advancer if any; that is the debited account's consent, not a separate governance decision. A distinct approver must be a required signer, an advancer or an authenticated input.","SEC06-P05 PROPOSED; still needs double-satisfaction negatives across scripts and S2 versions, a coalesced positive under partition, fee-over-cap and dropped-duty cases, the approver-coverage lint, a genuine validator-checked signature in real context, and independent custody/duty/backing accounting with a backing-policy negative."],evidenceStage:"V2 SOURCE READING; allocation policy PROPOSED per profile",sourceRefs:["ERR-08","ERR-09","ERR-10","ERR-23","ERR-24","CL-22","CL-25","CL-41","CL-48","CL-51","SEC06-P05 PROPOSED"]},{id:"duties-backing-fees",title:"Duties, backing and fees",body:"S12 and S13 source behavior requires non-negative custody, not full backing of liabilities. S12 funds escrow at 110: partial(35) debits 37 and leaves 73 against duties of 75 (invoice 65, reserve 10), which is 2 short. Funding 112 would back one partial; each further partial charges another 2 that no duty reflects. That backing is a PROPOSED application policy. S12 has no extra transfer and no reserve-duty-return action; after finish, escrow holds 8 against reserve duty 10, and the nonzero reserve duty blocks V2 Close. S13 allocate(true,23,7,2) needs at least 23 A and 4 B for non-negative custody; 25 A and 10 B is PROPOSED full backing, and S13 has no action discharging allocation_reserve.",assumptions:["Source-only arithmetic, not execution. The V2 Close zero-duty condition is an uncompiled-source reading.","Even under the proposed 112 policy the reserve duty stays 10 and Close stays blocked; discharge or migration needs a program change.","S13 units is checked only arithmetically (23 = 3\xD77 + 2) and is never debited.","A program-asset fee is not debt repayment and not a network fee. Network fees, collateral, claim-output min-ADA and the V2 thread reserve (lovelace returned on Close) are separate funding items; a reserve duty is a program liability.","Delivery evidence and dispute rules remain named assumptions. Still needs independent open/partial/finish/reserve-return accounting and a backing-policy negative."],evidenceStage:"Source arithmetic reading; full backing PROPOSED",sourceRefs:["ERR-21","ERR-22","ERR-25","ERR-28","CL-19","CL-20","CL-25","CL-26","CL-52","S12 actions","S13 action allocate","SEC06-P05 PROPOSED"]}],glossaryClarifications:[{term:"Strand",clarification:"An individual proof with its claim, statement and binding metadata. Before a proof exists, say requirement or planned proof. A signed owner intent, UTxO, claim output, validator, catalogue entry, pattern or predicate is not a Strand.",sourceRefs:["CL-04","ERR-28","A04 /glossary"]},{term:"Web",clarification:"PROPOSED: the contract-fixed set of required Strands for one transition, accepted all-or-nothing by the consuming validator in a supported profile. Profiles refuse unsupported classes; certificates, authenticated history, private handoff, recursion and bounded multiparent remain required future tracks.",sourceRefs:["ERR-01","CL-03"]},{term:"Claim specification",clarification:"The reusable type of a Strand; not itself a proof. Reusing a specification does not reuse a proof for changed state.",sourceRefs:["CL-05","ERR-28"]},{term:"Claim output",clarification:"V2 SOURCE READING: a C2 UTxO holding one token named H(envelope), minted after the claim policy's Groth16 check. It confers no authority by itself and is neither the proof nor its validator.",sourceRefs:["ERR-28","A04 /glossary"]},{term:"Verified at issuance / at consumption",clarification:"Issuance is the reviewed V2 route. Verification at consumption is PROPOSED and needs a new redeemer and in-settlement pairings.",sourceRefs:["ERR-04","ERR-12","ERR-26"]},{term:"Thread reserve / reserve duty",clarification:"Thread reserve is V2 lovelace returned on Close. A reserve duty is a program liability such as S12 reserve or S13 allocation_reserve.",sourceRefs:["ERR-28"]},{term:"Intent revocation (Revoke) / key migration",clarification:"Revoke advances seq to cancel outstanding intents and can orphan issued claims. Key migration (VK change) is PROPOSED; V2 catalogues are immutable.",sourceRefs:["ERR-06","ERR-14","ERR-28"]},{term:"Allocation policy",clarification:"A per-profile choice between strict one-output-per-obligation (reviewed V2 scope: one S2 script hash) and a consumer-recomputed amount partition.",sourceRefs:["ERR-08","ERR-23"]},{term:"thread (internal identifier)",clarification:"thread is a V2 source identifier for the consumer's state instance (thread id, thread effects, thread reserve). It is not a public synonym for Strand; public vocabulary is Web and Strand.",sourceRefs:["BRIEF item 1","ERR-28"]},{term:"Assembled (page state)",clarification:"ILLUSTRATION: every illustrated requirement has an illustrated Strand. It is not proof verification, acceptance or settlement.",sourceRefs:["PLAN interfaces note","ERR-15"]},{term:"Settlement",clarification:"Actual target-ledger acceptance of the authorized effects under the applicable conditions. Nothing on this page settles anything.",sourceRefs:["CONCEPT glossary"]},{term:"CATALOGUE-AUTHOR ASSERTION",clarification:"A link stated by the catalogue author and not checked on-chain, here between program_hash/source_hash and predicate_digest/vk_digest.",sourceRefs:["ERR-13"]},{term:"PREMISE",clarification:"A Cardano ledger rule assumed by the reasoning but not contained in the sources, for example single spending of an outref.",sourceRefs:["A03 \xA70"]}],diagramRules:[{id:"DR-01",rule:"When the explorer draws several illustrated Strand roles (for example three), show the label: Illustrated roles. Separate relations, their proof producers and a required-set consumer are unestablished. Drawing a role never implies an existing producer.",sourceRefs:["CONCEPT useful job","CL-17","SEC06-P02 PROPOSED","ERR-10"]},{id:"DR-02",rule:"Only proof-bearing items are drawn as Strands. Draw signed owner intents, UTxOs, claim outputs, validators, catalogue entries, patterns and predicates with a distinct shape and legend entry, never with the Strand symbol.",sourceRefs:["CL-04","ERR-28"]},{id:"DR-03",rule:"Incomplete state text: Incomplete required set (illustration). Under the PROPOSED all-or-nothing rule it has no authority over thread effects. Optional second line: On the issuance route, already-issued claim outputs could still exist on-chain, lock min-ADA and be releasable only by their claimant. Never use verified, valid, accepted, settled, success, a check icon or a settlement color for this state.",sourceRefs:["ERR-15","SEC06-P01 PROPOSED"]},{id:"DR-04",rule:"Restored state text: Illustrative set assembled. Not proof verification, not acceptance, not settlement. No success badge, check icon or celebratory motion, and visually distinct from any recorded-evidence treatment.",sourceRefs:["ERR-15","PLAN interfaces note"]},{id:"DR-05",rule:"A connection from a Strand to its consumer means required by (PROPOSED). Do not label it verifies, executes or triggers, and do not depict automatic output triggering, chaining, aggregation, recursion or batching.",sourceRefs:["CL-06","CL-07","ERR-04"]},{id:"DR-06",rule:"Issuance-route diagram order: owner intents signed \u2192 proof production \u2192 one Issue per Strand (C2 checks the proof, mints one claim output, locks min-ADA) \u2192 one settlement (consumes claim outputs, recomputes statements against the issuance-checked digest, each claimant signs, tokens burned) \u2192 separate observation of inclusion, finality and readback. Label it V2 SOURCE READING, structural, not observed. Draw proof-at-consumption only as a separate PROPOSED alternative.",sourceRefs:["ERR-04","ERR-12","ERR-25","ERR-26","CL-47"]},{id:"DR-07",rule:"Context provenance: label illustrated context values as supplied, unauthenticated unless a named authentication path is shown. No freshness badge from a validity interval, no network-authentication badge from the catalogue network byte, and the claimant shown as prover-chosen bytes, not an authenticated identity.",sourceRefs:["ERR-03","ERR-07","ERR-11","ERR-19"]},{id:"DR-08",rule:"Illustrative identifiers, digests and counts must read as obvious placeholders (for example illustrative-statement-01), never as real-looking hex. Recorded values such as the S07/S08 VK digest prefix or the K10 cpu/mem figures appear only in the evidence drawer with their recorded scope.",sourceRefs:["ERR-05","ERR-18","BRIEF item 2"]},{id:"DR-09",rule:"Financial partial progress (a duty remaining) and a missing required proof are separate states with separate controls. The invoice worksheet never changes Web completeness, and no proof badge appears in the worksheet.",sourceRefs:["CL-21","SEC06-P01 PROPOSED","SEC06-P05 PROPOSED"]},{id:"DR-10",rule:"Every security-relevant state (incomplete, illustrative assembled, PROPOSED, OPEN, recorded) is conveyed in text, not by color or motion alone.",sourceRefs:["ERR-15"]}],invoiceRules:[{id:"IR-01",rule:"Opening is a source reading, not an executed result: S12 open(90,10) gives invoice duty 100 (face = 90 + 10), reserve duty 10 and escrow 110 CASH. The buyer pays the 110 transfer plus a 3 CASH program-asset fee, a gross debit of 113. CASH is the S12 fixture asset (network oracle-unit), not a Cardano asset.",sourceRefs:["S12 action open","CL-19"]},{id:"IR-02",rule:"Slider domain: integers 1 to 99 inclusive. S12 partial requires amount > 0 and amount < opening, and opening is 100.",sourceRefs:["S12 action partial"]},{id:"IR-03",rule:"0 and 100 are refusals, not accepted source actions. If shown as test cases, label them Refused: requires amount > 0, and Refused: requires amount < opening (100). Paying the whole balance is the separate finish action, which charges no fee and is not part of this one-partial worksheet.",sourceRefs:["S12 action partial","S12 action finish"]},{id:"IR-04",rule:"Source behavior (S12, not executed): escrow debit = amount + 2; escrow cash = 110 \u2212 amount \u2212 2; invoice duty = 100 \u2212 amount; reserve duty = 10; total duties = 110 \u2212 amount. After one partial the source path is always 2 short of total duties. Example amount 35: debit 37, cash 73, duties 65 + 10 = 75. Never label this path fully backed.",sourceRefs:["ERR-22","CL-19","CL-52"]},{id:"IR-05",rule:"PROPOSED full-backing view: funding 112, cash = 112 \u2212 amount \u2212 2, which equals total duties after one partial. Label it PROPOSED application policy. S12 open funds exactly face + reserve and has no extra transfer, so 112 is not an S12 action, and the source enforces only non-negative custody, not backing.",sourceRefs:["ERR-22","CL-19","CL-26"]},{id:"IR-06",rule:"Funding 112 backs one partial only. Each further partial charges escrow another 2 that no duty reflects, so later fees create further gaps unless a further rule and funding are adopted.",sourceRefs:["ERR-22"]},{id:"IR-07",rule:"The 2 CASH fee goes to fees and is not debt repayment; the invoice duty falls only by the payment amount. Network fees, collateral, claim-output min-ADA and the V2 thread reserve are separate, unknown here and not included in the worksheet.",sourceRefs:["ERR-25","ERR-28","CL-19"]},{id:"IR-08",rule:"Reserve: S12 has no reserve-duty-return action, so reserve duty 10 remains. If finish is mentioned, the source path leaves cash 8 against reserve duty 10 (the proposed 112 path leaves 10 against 10), and the nonzero reserve duty blocks V2 Close either way. Never show closed, complete or reserve returned.",sourceRefs:["ERR-22","CL-20","CL-52"]},{id:"IR-09",rule:"The worksheet is a local arithmetic lesson. It does not execute Moriarty or a proof and creates no transaction or ledger state. A permitted partial step is intended to carry every proof required for that step (PROPOSED; consumer enforcement OPEN); remaining duty is not a missing proof.",sourceRefs:["BRIEF item 3","CL-21","SEC06-P01 PROPOSED","SEC06-P05 PROPOSED"]},{id:"IR-10",rule:"Required visible labels: Source behavior (S12, not executed) and PROPOSED full-backing policy, plus the explicit 2-short line on the source path.",sourceRefs:["ERR-22"]}],forbiddenPhrases:[{phrase:"trustless",instead:"State the named assumptions (honest setup, T3 OPEN, forgeable test setup).",sourceRefs:["A04 /notApprovedPhrases"]},{phrase:"proven on Cardano",instead:"One genuine proof was accepted by a compiled C2 wrapper in a local VM with fabricated context (S08); no on-chain transaction is recorded.",sourceRefs:["ERR-17"]},{phrase:"secure, security guarantee, guaranteed, audited, security-approved (unscoped)",instead:"Use the card text with its assumptions and evidence stage.",sourceRefs:["A03 \xA71","A03 \xA711"]},{phrase:"verified, valid, accepted or settled for an assembled or restored illustration",instead:"Illustrative set assembled. Not proof verification, not acceptance, not settlement.",sourceRefs:["ERR-15"]},{phrase:"Bring proof with the transaction",instead:"Bring the required proofs to the transition.",sourceRefs:["ERR-26"]},{phrase:"settlement verifies the proofs",instead:"Settlement recomputes each statement and compares it with the digest checked at issuance.",sourceRefs:["ERR-12"]},{phrase:"two extra transactions per Strand",instead:"One Issue transaction per required Strand plus one settlement (structural source reading).",sourceRefs:["ERR-04"]},{phrase:"a partial Web is off-chain only",instead:"An incomplete Web has no authority over thread effects; already-issued claim outputs can exist on-chain and lock value.",sourceRefs:["ERR-15"]},{phrase:"each output credited to exactly one obligation (unscoped)",instead:"Under this profile's allocation rule, no payment can be counted toward two obligations.",sourceRefs:["ERR-08"]},{phrase:"cannot be replayed on another network (as a statement property)",instead:"Separation across networks rests on outref uniqueness; the network byte is catalogue-declared.",sourceRefs:["ERR-07"]},{phrase:"fresh as of the validity interval",instead:"A validity interval bounds when the transaction may apply; it does not date or authenticate a datum.",sourceRefs:["ERR-11"]},{phrase:"program identity is invisible",instead:"Program and source hashes are visible and signed; their link to predicate/VK is a CATALOGUE-AUTHOR ASSERTION.",sourceRefs:["ERR-13"]},{phrase:"no production ceremony exists (unbounded)",instead:"No production ceremony is recorded in the supplied sources.",sourceRefs:["ERR-14"]},{phrase:"every context is fabricated (unbounded)",instead:"Every recorded proof context in the supplied sources is caller-fabricated (S07, S08).",sourceRefs:["ERR-19"]},{phrase:"one setup per predicate, or a setup count derived from predicate, catalogue or family counts",instead:"Setup is per distinct compiled circuit; the required total is unknown.",sourceRefs:["ERR-14"]},{phrase:"claimant authenticated, or prover identity",instead:"The claimant is prover-chosen bytes bound at consumption in source.",sourceRefs:["ERR-03"]},{phrase:"governance-approved, from approved=true",instead:"Consent of the effect-derived required signers, not a separate governance decision.",sourceRefs:["ERR-09","ERR-24"]},{phrase:"fully backed or backing enforced, for the S12 source path",instead:"The source checks only non-negative custody; full backing is a PROPOSED policy.",sourceRefs:["ERR-21","ERR-22"]},{phrase:"reserve returned, invoice closed, lifecycle complete",instead:"S12 has no reserve-duty-return action; the nonzero reserve duty blocks V2 Close.",sourceRefs:["ERR-22"]},{phrase:"verified on-chain, or ledger cost, for the S08 local VM figure",instead:"Whole local C2 Issue evaluation; not isolated verification or ledger ExUnits.",sourceRefs:["ERR-05"]},{phrase:"235 proven properties; supports all 20 families",instead:"235 pre-dedup review identifiers; 20 families retained as requirements.",sourceRefs:["CL-31","CL-32"]},{phrase:"cheaper, faster, lower fees",instead:"No advantage is claimed; no measurement exists.",sourceRefs:["CL-29","CL-30"]}],footer:"Security presentation copy by role06 (requested Opus 5.5 HIGH) for a PROPOSED local draft of the Webs and Strands page, used with SECURITY-ERRATA.json. V2 descriptions are Opus source-level readings of unadopted, uncompiled code; recorded results are local and scoped, with a forgeable test setup and fabricated contexts. No security approval, adoption, release or publication is implied. Fresh review of the final page is pending."},learning:{format:"moriarty-webs-page-learning/1",status:"PROPOSED_LOCAL_PAGE_CONTRIBUTION",journey:[{id:"define",title:"Define one financial action",body:"Choose a target/profile. Name exact assets, recipients, fee limits and continuing duties.",status:"PROPOSED"},{id:"compare",title:"Compare independent effects",body:"Separate source behavior from proposed policy. Keep the arithmetic worksheet independent of the proof illustration.",status:"PROPOSED"},{id:"map",title:"Map requirements to evidence",body:"Identify each claim specification, statement and proof producer. Missing mappings remain visible.",status:"PROPOSED"},{id:"observe",title:"Keep each stage visible",body:"Distinguish preparation, authorization, proof production, assembly, submission and actual effect readback.",status:"PROPOSED"}],journeySourceRefs:[{label:"Proposed staged developer journeys",document:"DEVELOPER-EXPERIENCE.md",pointer:"Journey A: build a first dapp action",pointerType:"markdown-heading"}],faq:[{id:"strand",question:"What is a Strand?",answer:"An individual proof with its claim, statement and binding metadata. Before a proof exists, say requirement or planned proof. A signed owner intent, UTxO, claim output, validator, catalogue entry, pattern or predicate is not a Strand.",sourceRefs:[{label:"Opus role06 wording",document:"SECURITY-COPY.json",pointer:"/glossaryClarifications/0/clarification",pointerType:"json-pointer"}],wording:"EXACT_OPUS_QUOTE"},{id:"assembled",question:"Does restoring a Strand verify the Web?",answer:"ILLUSTRATION: every illustrated requirement has an illustrated Strand. It is not proof verification, acceptance or settlement.",sourceRefs:[{label:"Opus role06 wording",document:"SECURITY-COPY.json",pointer:"/glossaryClarifications/9/clarification",pointerType:"json-pointer"}],wording:"EXACT_OPUS_QUOTE",securityDisclosureRef:{label:"Full Opus scope and assumptions",document:"SECURITY-COPY.json",pointer:"/cards/5",pointerType:"json-pointer"}},{id:"partial-evidence",question:"Is a remaining payment duty a missing proof?",answer:"Financial partial progress (a duty remaining) and a missing required proof are separate states with separate controls. The invoice worksheet never changes Web completeness, and no proof badge appears in the worksheet.",sourceRefs:[{label:"Opus role06 wording",document:"SECURITY-COPY.json",pointer:"/diagramRules/8/rule",pointerType:"json-pointer"}],wording:"EXACT_OPUS_QUOTE",securityDisclosureRef:{label:"Full Opus scope and assumptions",document:"SECURITY-COPY.json",pointer:"/cards/5",pointerType:"json-pointer"}},{id:"partial-range",question:"Why does the payment stop at 99?",answer:"Slider domain: integers 1 to 99 inclusive. S12 partial requires amount > 0 and amount < opening, and opening is 100.",sourceRefs:[{label:"Opus role06 wording",document:"SECURITY-COPY.json",pointer:"/invoiceRules/1/rule",pointerType:"json-pointer"}],wording:"EXACT_OPUS_QUOTE"},{id:"proposed-funding",question:"Can S12 fund the escrow with 112?",answer:"PROPOSED full-backing view: funding 112, cash = 112 \u2212 amount \u2212 2, which equals total duties after one partial. Label it PROPOSED application policy. S12 open funds exactly face + reserve and has no extra transfer, so 112 is not an S12 action, and the source enforces only non-negative custody, not backing.",sourceRefs:[{label:"Opus role06 wording",document:"SECURITY-COPY.json",pointer:"/invoiceRules/4/rule",pointerType:"json-pointer"}],wording:"EXACT_OPUS_QUOTE",securityDisclosureRef:{label:"Full Opus scope and assumptions",document:"SECURITY-COPY.json",pointer:"/cards/7",pointerType:"json-pointer"}},{id:"reserve-duty",question:"Does finishing the invoice return the reserve?",answer:"Reserve: S12 has no reserve-duty-return action, so reserve duty 10 remains. If finish is mentioned, the source path leaves cash 8 against reserve duty 10 (the proposed 112 path leaves 10 against 10), and the nonzero reserve duty blocks V2 Close either way. Never show closed, complete or reserve returned.",sourceRefs:[{label:"Opus role06 wording",document:"SECURITY-COPY.json",pointer:"/invoiceRules/7/rule",pointerType:"json-pointer"}],wording:"EXACT_OPUS_QUOTE",securityDisclosureRef:{label:"Full Opus scope and assumptions",document:"SECURITY-COPY.json",pointer:"/cards/7",pointerType:"json-pointer"}},{id:"where-checked",question:"Where would proofs be checked?",answer:"Issuance is the reviewed V2 route. Verification at consumption is PROPOSED and needs a new redeemer and in-settlement pairings.",sourceRefs:[{label:"Opus role06 wording",document:"SECURITY-COPY.json",pointer:"/glossaryClarifications/4/clarification",pointerType:"json-pointer"}],wording:"EXACT_OPUS_QUOTE",securityDisclosureRef:{label:"Full Opus scope and assumptions",document:"SECURITY-COPY.json",pointer:"/cards/4",pointerType:"json-pointer"}},{id:"permissionless",question:"Do developers need Moriarty approval?",answer:"Supported public tooling is permissionless. Maintainer, council, campaign and registry approval are not developer prerequisites. Asset-owner authorization and objective target validity still apply.",sourceRefs:[{label:"Permissionless product boundary",document:"CONCEPT.md",pointer:"Developer experience and ecosystem delivery",pointerType:"markdown-heading"}]},{id:"sdk",question:"Can I use these as SDK instructions?",answer:"These are proposed learning stages, not shipping SDK methods or runnable commands. Follow a target-specific capability guide and stop at unsupported boundaries.",sourceRefs:[{label:"Proposed developer interfaces",document:"DEVELOPER-EXPERIENCE.md",pointer:"Current source commands and future ergonomics",pointerType:"markdown-heading"}]}],evidence:[{id:"current-record",title:"Current maturity",body:"Moriarty Webs is a concept under review. Supplied records include one current-Rust invoice-partial Groth16 roundtrip (S07) and seven finite local compiled-C2-wrapper cases (S08: one acceptance and six mutation rejections), with a single-party test setup whose operator can forge proofs and caller-fabricated proof contexts. No on-chain transaction is recorded. Only a conditional lowering argument is adopted. V2 consumer descriptions on this page are Opus readings of unadopted, uncompiled source, not observed behavior or exact-source correspondence to those runs. General Web integration, genuine intent authorization, onchain settlement and all-family compatibility remain unestablished in this packet. Local VM cost is not ledger cost. Every interactive example on this page is an illustration.",stage:"RECORDED",limitations:["Recorded observation in a supplied S07/S08 record; local and scoped, not ledger acceptance."],sourceRefs:[{label:"Opus maturity wording",document:"SECURITY-COPY.json",pointer:"/maturity/body",pointerType:"json-pointer"},{label:"S07: one current-Rust invoice-partial roundtrip",document:"S07-K6-ACTUAL-ADOPTION.json",pointer:"/scope",pointerType:"json-pointer"},{label:"S08: seven finite local compiled-wrapper cases",document:"S08-K10-ACTUAL-ADOPTION.json",pointer:"/predicate",pointerType:"json-pointer"},{label:"S08: result limitations",document:"S08-K10-ACTUAL-ADOPTION.json",pointer:"/scopeLimitations",pointerType:"json-pointer"}],wording:"EXACT_OPUS_QUOTE"},{id:"conditional-t1",title:"Conditional source argument only",body:"A01 adopts only conditional T1: the all-role conjunction equals whole-action Core over one decoded body, modulo premise G including output well-formedness, a covering WebPlan, whole-action compilation first and the same field.",stage:"CONDITIONAL_ARGUMENT",limitations:["There is no implementation, no T2, no T3 and no full WP migration (F07\u2013F10); builder reliance is not permitted."],sourceRefs:[{label:"Opus: conditional T1 and explicit exclusions",document:"SECURITY-COPY.json",pointer:"/cards/5/assumptions/2",pointerType:"json-pointer"}],wording:"EXACT_OPUS_QUOTE_SPLIT_WITHOUT_CHANGE"}],securityScope:{id:"v2-source-scope",body:"Every V2 consumer or claim-policy description here is an Opus source-level reading of unadopted, uncompiled Aiken/Rust files. It is not observed compiled behavior and not exact-source evidence for the recorded S07 roundtrip or the S08 compiled C2-wrapper (K10) runs: no supplied record pins those binaries or compiled bytes to the reviewed source. The four-piece settle implementation and byte/type helpers were not supplied to the reviewer; four-piece reuse rests on S09 and source comments.",attribution:"Opus role06; exact wording, not a security judgment by role08.",sourceRefs:[{label:"Opus source-reading caveat",document:"SECURITY-COPY.json",pointer:"/statusScope/sourceReadingCaveat",pointerType:"json-pointer"}],displayRule:"Keep this scope adjacent to V2 descriptions or one accessible disclosure away."},nextSteps:["Explore the invoice worksheet.","Compare the five proposed applications.","Open the evidence and its limitations."],broaderScope:{body:"One example does not establish compatibility. The wider language and evidence requirements remain open.",retainedFamilies:["S01","S02","S03","S04","escrow-time","interval-boundary","joint-role","oracle-observation","bilateral atomic escrow swap","constant-product exact rounding/slippage with serialized pool continuation","order execution versus timeout cancellation","two-order batch exact input coverage and injective output allocation / same-output double satisfaction","F01-origination","F02-interest-period","F03-partial-repayment-residual-liability","F04-fee-gross-net-policy","AP01","AP02","AP03","AP04"],familiesStatus:"Requirements, not supported ports.",actus:"277 fixtures, 18 executable types, 32 taxonomy dispositions and DS01\u201307.",defi:"72 rows, DA01\u201324, held-outs, intent cases and regressions.",furtherTracks:["General financial obligations","Universal property certificates","Authenticated history","Recursion","Private handoff","Bounded multiparent PCD"],target:"Midnight ZKIRv3 and native proof infrastructure remain the broader target; Cardano is an additional experiment.",qualification:"Preview-first and later Preprod end-to-end acceptance remain required for claimed targets.",catalogue:"235 pre-dedup review identifiers, not proven properties. Original 42/52 lists remain unrecovered. Required setup count is unknown.",sourceRefs:[{label:"Exact retained family IDs",document:"S02-PATTERN-INVENTORY.json",pointer:"",pointerType:"json-pointer"},{label:"Retained financial and composition scope",document:"S07-K6-ACTUAL-ADOPTION.json",pointer:"/allRequiredScopeRetained",pointerType:"json-pointer"},{label:"Broader target and provenance boundaries",document:"CONCEPT.md",pointer:"Evidence appendix and retained breadth",pointerType:"markdown-heading"}]},worksheetConstraints:{status:"ILLUSTRATION_ONLY",sourceAmountRange:[1,99],amount0:"SOURCE_PARTIAL_REFUSED",amount100:"SOURCE_PARTIAL_REFUSED",funding110:"S12 source reading, not executed.",funding112:"PROPOSED application policy; not reachable with S12 as written.",laterPartialFees:"Funding 112 backs one partial only. Each further partial charges escrow another 2 that no duty reflects, so later fees create further gaps unless a further rule and funding are adopted.",sourceRefs:[{label:"Literal partial predicate and fixture correction",document:"SOURCE-PRECONDITION-CLARIFICATION.json",pointer:"/worksheetSourceValidAmountRange",pointerType:"json-pointer"},{label:"112 is not an S12 action",document:"SECURITY-COPY.json",pointer:"/invoiceRules/4",pointerType:"json-pointer"},{label:"Further fees",document:"SECURITY-COPY.json",pointer:"/invoiceRules/5",pointerType:"json-pointer"}]}},v2:{format:"moriarty-webs-v2-copy/1",author:"Opus 5.5 HIGH (requested) security and cryptographic copy author for the v2 Webs and Strands page. Authored copy, not a review of the integrated page; fresh exact-page Muse and Opus reviews follow.",presentation:"User direction 2026-10-16 (don't ai slop hedge, the html explains the fully implemented concept. We will finish this implementation) supersedes historical requirements for pervasive PROPOSED/illustrative/future labels, exact diagram strings and adjacent per-paragraph caveats within this page. The main object explains the complete product design in present tense. Actual implementation status, trust assumptions and evidence appear once, in the technical object.",templateVariables:{amount:"Seller payment; integer 1 to 99 inclusive; default 35",fee:"Partial-payment program fee; constant 2",debit:"Gross escrow debit = amount + fee",openingCash:"Escrow opening cash; main default 112 (fee-funded design); 110 only in the technical source comparison",cash:"Escrow cash after the payment = openingCash \u2212 amount \u2212 fee",invoiceDuty:"100 \u2212 amount",reserveDuty:"Constant 10",duties:"invoiceDuty + reserveDuty = 110 \u2212 amount"},main:{heroBody:"Moriarty Webs let a Cardano financial application bring the required proofs to a transition. The consuming contract names every Strand it needs \u2014 the payment arithmetic, the fee, the duties that continue \u2014 and its validator accepts the transition only when each one is present and matches a statement rebuilt from the transaction itself. Owners sign exact limits on what can leave their accounts, fees stay separate from repayment, and what is still owed stays on the record. Webs are built for Cardano developers writing financial dapps, and for the wallets, asset issuers and transaction builders that work alongside them.",explorerIntro:"Choose one of five financial transitions. Each Web lists the Strands its contract requires and the exact statement each one proves. A role names a condition the transition must prove; one whole-execution proof can cover several roles. Remove a Strand to see how the consuming contract treats an incomplete Web.",proofRoleExplanation:"Each Strand carries one proof, and a proof does one job: it shows that the Strand\u2019s statement holds \u2014 that the payment, fee, limits and duty updates are computed correctly from the values the statement contains. A proof cannot show that those values describe the real ledger. Ledger facts \u2014 which state is being spent, which outputs exist, who signed \u2014 come from the transaction itself. That is why the settling validator rebuilds every statement from the transaction and the state it spends, and accepts a Strand only when the rebuilt statement matches the one whose proof was checked at issuance. Facts from outside the chain, such as a delivery document or a price, enter only with a named issuer, an authentication path and a freshness limit. The proof supplies correct computation; the validator supplies authenticated premises and scope.",definitions:[{term:"Web",body:"The complete set of Strands a consuming contract requires for one transition. The contract fixes the set and the validator accepts it all-or-nothing: with every required Strand present and matching, the transition can settle; with any one missing, it has no authority over the contract\u2019s effects. Each profile states which kinds of Strand it accepts and refuses the rest."},{term:"Strand",body:"One proof together with its claim, its statement and the metadata that binds it to a single step: the state being spent, its sequence number, the settling script, the catalogue, the signed intents and the claimant. Signed intents, UTxOs, proof-claim outputs, validators and catalogue entries are not Strands."},{term:"Claim specification",body:"The reusable type of a Strand: what is asserted, about which subject, under which premises and for which relation. Many Strands share one specification; reusing a specification never reuses a proof for changed state."}],assemblyComplete:"Complete Web. Every required Strand is present, so the transition can go to settlement, where the validator rebuilds each statement from the transaction and enforces the signed effects.",assemblyIncomplete:"Incomplete Web. A required Strand is missing, so the transition has no authority over the contract\u2019s effects. Proof-claim outputs already issued stay on-chain, hold their min-ADA, and only their claimant can release them.",worksheet:{title:"One partial payment, in full",intro:"Choose a seller payment. The invoice opens with 100 CASH of invoice duty and 10 CASH of reserve duty, and the escrow holds {openingCash} CASH.",modeLabel:"Funded for one partial payment \xB7 112 CASH",modeBody:"The escrow holds the 100 CASH invoice duty, the 10 CASH reserve duty and a 2 CASH allowance for this payment\u2019s program fee, so cash matches duties after the payment.",amountLabel:"Seller payment (CASH)",amountRangeNote:"A partial payment is more than 0 and less than the 100 CASH opening invoice duty. Paying the whole balance is a separate finish action.",rows:{sellerReceives:"Seller receives {amount} CASH",programFee:"Program fee to the fee recipient {fee} CASH",grossDebit:"Gross escrow debit {debit} CASH",escrowCash:"Escrow cash after payment {cash} CASH",invoiceDuty:"Invoice duty {invoiceDuty} CASH",reserveDuty:"Reserve duty {reserveDuty} CASH",totalDuties:"Total duties {duties} CASH"},backingLine:"Escrow holds {cash} CASH against {duties} CASH of duties.",feeRule:"Only the {amount} CASH payment reduces the invoice duty. The {fee} CASH fee goes to the fee recipient and repays nothing.",oneStepNote:"The 2 CASH allowance covers this one partial payment. Each further partial charges another {fee} CASH and needs its own funded allowance.",reserveNote:"Partial payments leave the {reserveDuty} CASH reserve duty untouched.",proofSeparation:"A remaining duty is ordinary financial progress, not a missing proof. The partial payment carries every Strand its step requires.",assetNote:"CASH is the invoice program\u2019s example unit, not a Cardano token.",networkFeeNote:"Network fees, collateral and the min-ADA held by proof-claim outputs are paid separately in ADA and are not estimated here."},lifecycleTitle:"From signed intent to settled transition",lifecycleIntro:"A transition moves through four stages. Signing, proving, issuing proof claims and settling are separate events, and no application effect happens until settlement.",lifecycleSteps:[{id:"authorize",title:"Authorize the outcome",body:"Each owner signs an intent before any proof exists. Per asset, it caps what can leave the account in total, in fees and as new liability, and sets the minimum net result for each beneficiary. It also names the validity window, a one-time nonce and the exact relation and verifying key the proofs must use."},{id:"prove",title:"Produce the Strands",body:"A prover runs the program and produces a proof for each Strand the Web requires. Each statement names one step: the state being spent, its sequence number, the settling script, the catalogue, the signed intents and the claimant. One whole-execution proof can serve several roles."},{id:"issue",title:"Issue proof claims",body:"Each proof goes on-chain in its own Issue transaction. The claim policy checks the Groth16 proof and mints one proof-claim output, which holds min-ADA until settlement consumes it or its claimant reclaims it after expiry. Proof-claim issuance records checked evidence. It never mints the application\u2019s own asset and moves no application funds."},{id:"settle",title:"Settle and read back",body:"One settlement transaction consumes every required proof-claim output. The validator rebuilds each statement from the transaction and the state it spends, compares it with the digest checked at issuance, requires each claimant\u2019s signature, burns each claim token, and enforces the signed caps, payments and continuing duties. The application then confirms inclusion, waits for the finality it needs and reads back the actual outputs and remaining duties."}],faqs:[{id:"claim-vs-asset",question:"Does issuing a proof claim mint my token?",answer:"No. Proof-claim issuance and application-asset minting are separate. Issuing a proof claim puts checked evidence on-chain as a proof-claim output; that token exists only to be consumed by a settlement, where it is burned. Your application asset is minted only by its own minting policy, which enforces the cap, the supply continuation and the recipients.",technicalCardId:"issuance-route"},{id:"permission",question:"Do I need approval from Moriarty to build with Webs?",answer:"No. Moriarty tooling is permissionless: any developer can write, compile, prove and deploy programs in the supported language without approval from Moriarty maintainers, a council, a campaign or a program registry. What still applies is objective: the ledger\u2019s validity rules and resource costs, and the authorization of the owners whose assets move. A program can still set its own access rules for its own users.",technicalCardId:"scope-and-permission"},{id:"owner-approval",question:"What does an owner actually approve?",answer:"An intent, signed before any proof is made. For each asset it caps the gross amount that can leave the account, the fees and any new liability, and it sets the minimum net amount each beneficiary must receive. It also names a validity window, a one-time nonce and the exact relation the proofs must satisfy. The signing view presents those limits in plain terms, together with the payment, the fee and the duties that remain afterward, with network fees shown separately.",technicalCardId:"effects-authority"},{id:"signers",question:"Who signs what, and when?",answer:"Owners sign their intents first, before proving. Each Issue transaction carries one proof; the claim policy checks it and mints one proof-claim output that names its claimant. The settlement transaction consumes those outputs, so it carries each claimant\u2019s signature and burns each claim token, while the contract checks the signed intents of the accounts the effects debit. A claim that is never used comes back through a reclaim its claimant signs after the expiry they chose. Implementation and evidence records where the per-transaction signer list stands today.",technicalCardId:"signer-boundary"},{id:"readback",question:"How does an application know the transition happened?",answer:"It observes three separate things: the transaction\u2019s inclusion, the finality the application requires, and a full readback of the actual outputs and remaining duties. It then reconciles those per-asset effects against what each owner signed. A timeout means the outcome is unknown, not that nothing happened.",technicalCardId:"readback-boundary"},{id:"partial-vs-missing",question:"Is a remaining duty a missing proof?",answer:"No. A partial payment is ordinary financial progress: the payment step carries every Strand it requires, and the unpaid invoice and reserve duties continue on the record. A missing Strand is different \u2014 it leaves the transition with no authority at all.",technicalCardId:"web-completeness"},{id:"unused-claims",question:"What happens to proof claims if a Web never settles?",answer:"They stay on-chain and keep holding their min-ADA. Only the claimant can release them, either through settlement or through reclaim after the expiry the claimant chose. If the owners\u2019 intents are revoked, or another settlement spends the same state first, those claims can no longer settle and wait for that expiry.",technicalCardId:"issuance-route"},{id:"cost",question:"Do more Strands mean lower cost?",answer:"Not by themselves. Each required Strand is issued in its own transaction before one settlement transaction consumes them all, and each proof-claim output holds min-ADA until it is consumed or reclaimed. A single whole-execution proof covering several roles is often the simpler design. Webs make every condition explicit and inspectable; cost comparisons come from measurement on the target network.",technicalCardId:"page-scope"}],caseCopy:[{id:"invoice",summary:"Pay part of an invoice out of escrow. The seller receives {amount} CASH, the {fee} CASH program fee goes to the fee recipient, and the unpaid invoice and reserve duties stay on the record.",roles:[{id:"invoice-payment",label:"Payment arithmetic",claim:"The seller payment matches the chosen partial amount.",statement:"Opening invoice duty 100 CASH; payment {amount} CASH; escrow debit for payment and fee {debit} CASH.",authentication:"The opening duty comes from the escrow state this transition spends, and CASH is the asset the invoice program declares."},{id:"invoice-fee",label:"Fee accounting",claim:"The {fee} CASH program fee is a separate payment.",statement:"Escrow pays the seller {amount} CASH and the fee recipient {fee} CASH; the fee does not reduce invoice duty.",authentication:"The consuming validator checks the actual seller and fee-recipient outputs against these amounts."},{id:"invoice-duty",label:"Duty continuation",claim:"Partial payment preserves the unpaid invoice and reserve duty.",statement:"Invoice 100 \u2212 {amount} = {invoiceDuty} CASH; reserve duty stays {reserveDuty} CASH; total duties {duties} CASH; escrow keeps {cash} CASH.",authentication:"Duties carry over from the spent escrow state and change only through recorded accruals and discharges."}]},{id:"dex",summary:"Settle a batch of orders against one pool transition. Every order keeps its own limits, and every owner gets an outcome they can check.",roles:[{id:"dex-orders",label:"Order arithmetic",claim:"Each order meets its own amount bounds.",statement:"Two orders each offer 100 A and require at least 90 B net; each owner receives 92 B.",authentication:"Asset identities and each owner\u2019s limits come from the owners\u2019 signed intents; the validator checks the actual outputs."},{id:"dex-pool",label:"Pool arithmetic",claim:"The pool continuation follows the pool\u2019s relation.",statement:"The reserve update, fee rule and exact rounding agree with both orders.",authentication:"Pool reserves come from the pool state being spent; any outside price carries its named source and freshness limit."},{id:"dex-batch",label:"Batch accounting",claim:"Order and pool amounts agree across the batch.",statement:"The amounts used for each owner\u2019s result are the amounts in the batch accounting, and no payment counts toward two orders.",authentication:"The consuming validator allocates actual outputs under its profile\u2019s rule: one output per order, or an exact partition that admits combined payments with every order allocated once."}]},{id:"issuance",summary:"Issue an application asset under a cap and distribute it to named recipients. Unissued capacity is not debt, and the proof claims that support the issuance are separate from the asset itself.",roles:[{id:"issuance-supply",label:"Supply arithmetic",claim:"The supply update stays within the cap.",statement:"First issue: 300 units under a cap of 1,000; unissued capacity is 700.",authentication:"The application asset\u2019s own minting policy enforces the cap and continues the supply state from its predecessor."},{id:"issuance-distribution",label:"Distribution arithmetic",claim:"The recipient allocation totals the issued amount.",statement:"Recipient one receives 180 units and recipient two receives 120 units; 180 + 120 = 300.",authentication:"The minting policy and the consuming validator check the actual mint and recipient outputs."},{id:"issuance-duties",label:"Duty accounting",claim:"Servicing duties remain separate from token supply.",statement:"The remaining 700 units of capacity are not debt. A redemption promise is a duty only when the program defines it.",authentication:"A servicing duty names its parties, its exact asset and its creation and discharge rules; eligibility documents keep their issuer and freshness limits."}]},{id:"loan",summary:"Service a loan payment with principal, accrual, payment, fee and remaining debt as separate amounts.",roles:[{id:"loan-accrual",label:"Accrual arithmetic",claim:"The period\u2019s accrual updates opening debt.",statement:"Debt 100 CASH plus accrual 5 CASH gives a duty of 105 CASH.",authentication:"The loan agreement fixes period, rate and rounding; a variable rate carries its named observation source and freshness rule."},{id:"loan-payment",label:"Payment accounting",claim:"Payment and fee keep their different meanings.",statement:"Debt payment 35 CASH plus separate fee 2 CASH gives payer gross debit 37 CASH.",authentication:"Payer, lender, fee recipient and asset match the payer\u2019s signed intent and the transaction\u2019s actual outputs."},{id:"loan-duty",label:"Debt continuation",claim:"Only the payment discharges the debt.",statement:"Duty 105 \u2212 repayment 35 = 70 CASH remaining; the 2 CASH fee is not repayment.",authentication:"The continuing debt carries over from the predecessor state through explicit accrual and discharge entries; collateral release follows its own policy."}]},{id:"treasury",summary:"Allocate treasury funds to named beneficiaries and keep the reserve and rebate duties visible afterward.",roles:[{id:"treasury-quotient",label:"Quotient arithmetic",claim:"The allocation inputs satisfy the program\u2019s arithmetic.",statement:"For allocate(true,23,7,2): 23 = 3 \xD7 7 + 2 and 2 < 3.",authentication:"The allocation inputs, including approved=true, sit inside the intent the debited treasury account signs; a separate governance approver must itself be a required signer, an advancer or an authenticated input."},{id:"treasury-payments",label:"Transfer accounting",claim:"The allocation amounts match the quotient.",statement:"Alpha receives 14 A and 4 B; beta receives 7 A; fees receive 2 A. Total custody debit is 23 A and 4 B.",authentication:"Treasury custody, the identities of A and B and the beneficiary outputs are checked by the consuming validator."},{id:"treasury-reserve",label:"Reserve accounting",claim:"New duties remain explicit after allocation.",statement:"Allocation creates a reserve duty of 2 A and a rebate duty of 6 B. The treasury holds 25 A and 10 B before the step and keeps 2 A and 6 B against those duties.",authentication:"Opening custody comes from the treasury state being spent; the consumer enforces that custody covers the duties."}]}]},technical:{title:"Implementation status and evidence",summary:"The page above describes Moriarty Webs as designed. This section records where the implementation stands. Supplied records include one current-Rust invoice-partial Groth16 roundtrip (S07) and seven local compiled-C2-wrapper cases (S08: one acceptance and six mutation rejections), with a single-party test setup whose operator can forge proofs and caller-fabricated proof contexts. No on-chain transaction is recorded. Descriptions of the consumer, claim policy, owner intents, duties and Close are Opus readings of unadopted, uncompiled V2 Aiken/Rust source, not observed behavior, and no supplied record pins the S07/S08 binaries or compiled bytes to that source. Of the composition argument, only conditional T1 is adopted; T2, T3 (compiled circuit/VK/BLAKE2b gadget correspondence) and the full WP migration are open. Not yet built: the all-or-nothing Web consumer and required-set enforcement, partial-step enforcement, real-context proofs, genuine intent signatures, the CLI/SDK and transaction build/submit/observe interfaces, a wallet signing display, the funding and backing actions behind the 112 CASH and 25 A / 10 B designs, reserve-duty discharge, batch issuance and any production setup ceremony. S08\u2019s local VM figures are not ledger cost, and no cost, latency or portability advantage is measured or claimed.",sourceVersusDesign:"Invoice. The worksheet uses the fee-funded design: escrow opens with 112 CASH. The executed source differs. S12 open(90,10) funds escrow with exactly 110 CASH (invoice duty 100 = 90 + 10, reserve duty 10) and charges the buyer a separate 3 CASH opening fee, a gross debit of 113. On that source path one partial of amount a debits a + 2 and leaves 110 \u2212 a \u2212 2 against duties of 110 \u2212 a: always 2 short (at 35: debit 37, cash 73 against duties 65 + 10 = 75). S12 checks only non-negative custody, not backing, and has no extra-funding transfer, so 112 needs a program change and a consumer-enforced backing policy. The buyer\u2019s opening debit under the 112 design is not specified by any source. 112 backs one partial only; each further partial charges escrow another 2 that no duty reflects, so a sequence of partials needs a further funding rule. S12 has no reserve-duty-return action: after finish the source path leaves 8 against reserve duty 10 and the 112 path leaves 10 against 10, and the nonzero reserve duty blocks V2 Close on either path; discharge or migration needs a program change. Treasury. S13 allocate(true,23,7,2) needs only 23 A and 4 B for non-negative custody; holding 25 A and 10 B so that 2 A and 6 B remain is a full-backing policy a consumer must enforce. units is checked only arithmetically (23 = 3\xD77 + 2) and is never debited. rebate(amount) can discharge the B rebate; S13 has no action discharging allocation_reserve, so Close stays blocked. DEX, issuance and loan amounts are worked examples with no supplied source program.",networkFeeNote:"Cardano network fees, collateral, the min-ADA held by each proof-claim output from issuance until settlement or claimant-signed post-expiry reclaim, and the V2 thread reserve (lovelace returned on Close) are separate from the CASH amounts in the worksheet. None is estimated on this page. A program-asset fee is neither debt repayment nor a network fee, and a reserve duty is a program liability, not the thread reserve.",signerBoundary:"What the reviewed V2 source fixes (uncompiled-source reading): owners sign intents before proving; each intent signs per-asset gross_cap, fee_cap, net_floor and liability_cap for a beneficiary, a validity window, nonce = seq and the target predicate, VK and shape digests. Each Issue transaction carries one proof, checked by the C2 claim policy, and mints one claim output. The settlement transaction requires the signature of each claimant whose claim output it consumes and burns that output\u2019s token. Unused claims are reclaimed with the claimant\u2019s signature after the claimant-chosen expiry. A supplied approved=true is consented to by the effect-derived required signers, and by a listed advancer if any; that is the debited account\u2019s consent, not a separate governance decision. The claimant is prover-chosen bytes bound at consumption, not an authenticated prover identity. Open: no transaction-by-transaction signer matrix (intent authorization, each Issue, settlement, reclaim) is published; the supplied material does not state who must sign an Issue transaction; no genuine intent signature is observed in the supplied proof records; no wallet signing display exists.",readbackBoundary:"Design: after submission the application separates inclusion, required finality and complete readback of outputs and remaining duties, and reconciles actual per-asset effects against the signed intents; a timeout leaves observation unknown and is not evidence of nonexecution. Status: no transaction build, submit or observe interface exists; no on-chain transaction is recorded; the acceptance and readback signal for a supported target still has to be defined and demonstrated, Preview first and later Preprod.",cardsIntro:"The cards below keep the reviewed role06 wording exactly. Labels such as PROPOSED, OPEN, PREMISE and V2 SOURCE READING describe the implementation status of the design explained above.",trustNotes:[{id:"proof-meaning",title:"What a verifying proof shows",body:"Under an honest setup and Groth16 knowledge soundness, a verifying proof shows the prover knew a witness satisfying the compiled constraints for its two public inputs. Linking those inputs to statement bytes additionally rests on the in-circuit BLAKE2b gadget and on BLAKE2b collision resistance. It never authenticates those bytes. A proof over supplied values does not make them an authenticated ledger fact or a true outside observation. A concrete execution proof, a universal property certificate and an authenticated ledger claim are different assertions; the latter two are not established Strand kinds.",assumptions:["The current class-0 test setup is forgeable by its operator, so no production security claim follows.","Whether the compiled constraints and verifying key match your source is OPEN (T3: compiled circuit/VK and BLAKE2b gadget correspondence).","Outside facts keep their named issuer, predicate, authentication path and freshness limits.","Reference-input reads are PROPOSED: the validator must read the datum itself and authenticate its origin. PREMISE: being unspent at application shows presence only, with no exclusivity or history. A validity interval neither dates nor authenticates a datum.","SEC06-P06 PROPOSED; still needs real-context stale-sequence and expired-attestation cases, changed-reference-datum and forged-origin negatives, N5/N7\u2013N9 at V, and a separately scoped real-context proof."],evidenceStage:"Assumption-bound Groth16 meaning; T3 OPEN; reference-input path PROPOSED",sourceRefs:["ERR-16","ERR-17","ERR-01","ERR-11","CL-27","CL-45","CL-49","S07 /limitations/universalPropertyCertificate","S07 /limitations/class0ControllerCanForge","SEC06-P06 PROPOSED"]},{id:"recorded-evidence",title:"What has actually been recorded",body:"Evidence layers (DEMO ONLY): H ordinary host tests captured (K4H, S04; fresh actual-result review pending) | N 1 local roundtrip (S07) | V 1 local C2 wrapper, 7 cases (S08) | P none. One genuine proof was accepted by a compiled C2 wrapper in a local VM with fabricated context (S08); no on-chain transaction is recorded. S08 /cases/0 records cpu 2222340191 and mem 205312 for the whole compiled C2 Issue evaluation, including its pairing; it is neither an isolated verification cost nor ledger ExUnits, fee or transaction fit. Every recorded proof context in the supplied sources is caller-fabricated (S07, S08).",assumptions:["No supplied record pins the recorded runs to the later V2 source bytes; V2 readings elsewhere on this page are not evidence about these runs.","Named runtime guards behind the six S08 rejections were not instrumented.","All 20 retained S02 families are requirements, not supported ports. The 235 catalogue IDs are pre-dedup review identifiers, not accepted or proven properties; the original 42/52 lists remain unrecovered.","Moriarty's broader target remains Midnight ZKIRv3 and native proof infrastructure; Cardano is an additional experiment and does not qualify Midnight. Preview-first and later Preprod end-to-end acceptance remain required for claimed targets.","SEC06-P08 PROPOSED (developer trust report); still needs a DEMO ONLY S07/S08 report with these qualified layers, fresh nonsecurity wording review and fresh security review. No new evidence is inferred from this layer wording."],evidenceStage:"RECORDED (local, scoped)",sourceRefs:["ERR-18","ERR-17","ERR-05","ERR-19","CL-11","CL-12","CL-13","CL-14","CL-31","CL-32","CL-33","CL-34","S07 /scope","S08 /cases","S08 /scopeLimitations","SEC06-P08 PROPOSED"]},{id:"setup-keys",title:"Setup and keys",body:"The current test setup can be forged by its operator; whether the verifying key matches the compiled relation is OPEN. Groth16 needs a separate setup per distinct compiled circuit (R1CS matrices), not per logical predicate. In the current Rust source the predicate digest is a circuit constant, so each distinct relation identity is a distinct circuit. The required total setup count is unknown; predicate, catalogue and family counts do not determine it. No production ceremony is recorded in the supplied sources, and none is proposed here.",assumptions:["A future universal circuit or Midnight's universal PLONK/KZG SRS would change the comparison (PROPOSED or target-specific).","V2 SOURCE READING: catalogue VK digests are fixed at genesis and carried unchanged, and Close requires zero balances and duties, so any key change needs a PROPOSED key migration action that carries residual duties.","Intent revocation (Revoke) advances seq; it is not key migration.","SEC06-P07 PROPOSED; still needs an old-VK-refused-after-migration negative, a setup-class report and independent review of any future ceremony."],evidenceStage:"RECORDED limitation (forgeable test setup); V2 SOURCE READING; total setup count UNKNOWN",sourceRefs:["ERR-14","ERR-28","ERR-17","CL-14","CL-32","CL-43","SEC06-P07 PROPOSED"]},{id:"binding-chain",title:"What ties a Strand to its step",body:"V2 SOURCE READING: tag, family, predicate_digest, shape_digest and body_len are circuit constants; the context fields vk_digest through intents_digest (bytes 112..339, including claimant_vkh) are free booleanized witness bits that are hashed, not interpreted. The consumer, not the circuit, ties those fields to the transaction: the settling validator rebuilds each statement from the transaction and the spent thread state, so a claim made for another thread step, catalogue, claimant or intent set does not match. Claimant binding happens at consumption, not at issuance: C2 Issue does not compare the claimant with the statement, so a mismatched envelope can be minted but cannot settle. This source-level binding is separate from T3, which stays OPEN.",assumptions:["The class-0 setup operator can forge a proof for any digest and any claimant. The claimant is prover-chosen bytes, not an authenticated prover identity.","Builders select claim inputs; the ledger spends each claim once (PREMISE). A copied proof can be re-issued with the same claimant and a new expiry; only that claimant can release it.","Catalogue program_hash and source_hash are visible, covered by catalogue_digest and signed in every owner intent. No on-chain check links them to predicate_digest or vk_digest: that link is a CATALOGUE-AUTHOR ASSERTION and VK-to-matrix is OPEN. Exact predicate-digest field coverage depends on identity.rs, which the reviewer did not read.","The statement's network byte is declared by the catalogue and not compared with the executing ledger; separation across networks rests on outref uniqueness (PREMISE).","SEC06-P03 and SEC06-P04 PROPOSED; still need competing-claimant and same-claimant duplicate negatives, second-party source\u2192relation\u2192predicate reproduction, refusal-list coverage, N5/N7\u2013N9, a T3 method, reviewed T2/T3 and F07\u2013F10, a non-test setup, and cross-network replay analysis if the network byte is relied on."],evidenceStage:"V2 SOURCE READING (unadopted, uncompiled); T3 OPEN",sourceRefs:["ERR-02","ERR-03","ERR-13","ERR-07","ERR-16","CL-36","CL-39","CL-40","CL-45","CL-46","SEC06-P03 PROPOSED","SEC06-P04 PROPOSED"]},{id:"issuance-route",title:"Where proofs are checked: the issuance route",body:"In the reviewed V2 source, each proof is checked when its claim is issued: the C2 claim policy checks a Groth16 proof and mints one claim output per Issue transaction. Claims must exist before settlement. The settlement transaction consumes them, recomputes each statement and compares it with the digest checked at issuance; it does not verify the proof again. Each consumed claim needs its claimant's signature on the settlement transaction and the burn of its token. Structurally, n required Strands mean n Issue transactions plus one settlement, excluding one-time genesis and any post-expiry reclaim. These counts are readings of uncompiled source, not measurements.",assumptions:["Each claim output locks min-ADA from issuance until settlement or claimant-signed reclaim after the claimant-chosen expiry. Several envelopes can exist per statement digest.","Safe but not live: any catalogue account may Revoke (advancing seq), and a competing settlement may spend the outref, orphaning issued claims and locking their value until expiry. Earlier reclaim is PROPOSED (OPEN).","Batch issuance needs a C2 change (PROPOSED). Proof-at-consumption is a different PROPOSED design needing a new redeemer and in-settlement pairings, with size and budget unmeasured. Mempool chaining is a node premise outside the sources.","V2 source already refuses two claims for one consumed outref; S09's role-level refusal is an unadopted proposal and not deduplication permission.","Owner intents are signed before proving; claimant settlement signatures are a later, distinct event. Proof collection or claim-output creation executes no effect.","Still needs orphan-after-Revoke, competing-settlement and post-expiry reclaim cases, and a qualified complete-path measurement of both verification placements."],evidenceStage:"V2 SOURCE READING (structural); not observed onchain",sourceRefs:["ERR-04","ERR-06","ERR-07","ERR-12","ERR-25","ERR-26","ERR-27","CL-02","CL-30","CL-47","CL-50","SEC06-P04 PROPOSED"]},{id:"web-completeness",title:"Complete and incomplete Webs",body:"PROPOSED: a Web settles only when every Strand its contract requires is present. An incomplete Web has no authority over thread effects. On the issuance route its already-issued claim outputs exist on-chain, lock value, and remain releasable only by their claimant. In the first proposed supported profile, the consumer refuses universal property certificates, authenticated-history claims, private handoff, recursive parents and multiparent joins as UNSUPPORTED; they remain required Web tracks, each needing its own trust path and evidence before any profile accepts it.",assumptions:["All-or-nothing acceptance and a consumer-derived required set are PROPOSED; no Web consumer, second genuine relation or general cardinality exists in this packet.","Depicting several Strand roles does not establish separate relations or producers. A whole-execution proof may cover several claim specifications; naming source expressions fee or liability does not create independent proof
