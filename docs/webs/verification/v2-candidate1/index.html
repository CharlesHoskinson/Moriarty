 producers.","A01 adopts only conditional T1: the all-role conjunction equals whole-action Core over one decoded body, modulo premise G including output well-formedness, a covering WebPlan, whole-action compilation first and the same field. There is no implementation, no T2, no T3 and no full WP migration (F07\u2013F10); builder reliance is not permitted.","OPEN: whether a consumer can enforce a fully authorized partial financial step that carries every proof that step requires, distinct from a missing proof.","SEC06-P01 and SEC06-P02 PROPOSED; still need N1/N12 and unknown-class refusal, a report-level test that an incomplete set never renders as accepted, N1\u2013N4/N6/N11/N14 at H/V, a wrong-action-index case, a required-set display, separate future-profile designs and fresh security review of reused V2 mechanisms."],evidenceStage:"PROPOSED; CONDITIONAL_ARGUMENT for T1 only",sourceRefs:["ERR-01","ERR-15","ERR-10","ERR-20","ERR-27","CL-03","CL-15","CL-16","CL-17","CL-21","CL-37","CL-38","SEC06-P01 PROPOSED","SEC06-P02 PROPOSED"]},{id:"effects-authority",title:"Effects, allocation and authority",body:"V2 SOURCE READING: owner intents sign per-asset gross_cap, fee_cap, net_floor and liability_cap for a beneficiary, a validity window, nonce = seq and the target predicate, VK and shape digests. Duties change only through recorded accruals and discharges, and a thread with a nonzero duty cannot close. The thread datum carries the complete custody snapshot, which custody must equal exactly. Actual output allocation is the consuming validator's job; a proof can attest arithmetic only over values the validator recomputes. A profile chooses either strict one-output-per-obligation or a consumer-recomputed amount partition that admits coalesced payments, with every obligation allocated exactly once.",assumptions:["The source strict-output rule covers redeemers of one S2 script hash only, not other scripts or S2 versions. No input value may count toward two obligations; ledger single-spend alone is not a value partition.","Circuit-level NotBound/TouchedOnly limits remain. A general multi-UTxO authenticated frame, role sets, cross-script allocation and partial-completion rules are PROPOSED.","No genuine intent signature is observed in the supplied proof records.","A supplied approved=true is consented to by the effect-derived required signers, and by a listed advancer if any; that is the debited account's consent, not a separate governance decision. A distinct approver must be a required signer, an advancer or an authenticated input.","SEC06-P05 PROPOSED; still needs double-satisfaction negatives across scripts and S2 versions, a coalesced positive under partition, fee-over-cap and dropped-duty cases, the approver-coverage lint, a genuine validator-checked signature in real context, and independent custody/duty/backing accounting with a backing-policy negative."],evidenceStage:"V2 SOURCE READING; allocation policy PROPOSED per profile",sourceRefs:["ERR-08","ERR-09","ERR-10","ERR-23","ERR-24","CL-22","CL-25","CL-41","CL-48","CL-51","SEC06-P05 PROPOSED"]},{id:"duties-backing-fees",title:"Duties, backing and fees",body:"S12 and S13 source behavior requires non-negative custody, not full backing of liabilities. S12 funds escrow at 110: partial(35) debits 37 and leaves 73 against duties of 75 (invoice 65, reserve 10), which is 2 short. Funding 112 would back one partial; each further partial charges another 2 that no duty reflects. That backing is a PROPOSED application policy. S12 has no extra transfer and no reserve-duty-return action; after finish, escrow holds 8 against reserve duty 10, and the nonzero reserve duty blocks V2 Close. S13 allocate(true,23,7,2) needs at least 23 A and 4 B for non-negative custody; 25 A and 10 B is PROPOSED full backing, and S13 has no action discharging allocation_reserve.",assumptions:["Source-only arithmetic, not execution. The V2 Close zero-duty condition is an uncompiled-source reading.","Even under the proposed 112 policy the reserve duty stays 10 and Close stays blocked; discharge or migration needs a program change.","S13 units is checked only arithmetically (23 = 3\xD77 + 2) and is never debited.","A program-asset fee is not debt repayment and not a network fee. Network fees, collateral, claim-output min-ADA and the V2 thread reserve (lovelace returned on Close) are separate funding items; a reserve duty is a program liability.","Delivery evidence and dispute rules remain named assumptions. Still needs independent open/partial/finish/reserve-return accounting and a backing-policy negative."],evidenceStage:"Source arithmetic reading; full backing PROPOSED",sourceRefs:["ERR-21","ERR-22","ERR-25","ERR-28","CL-19","CL-20","CL-25","CL-26","CL-52","S12 actions","S13 action allocate","SEC06-P05 PROPOSED"]},{id:"page-scope",title:"What the interactive page does",body:"The invoice worksheet is local browser arithmetic over the S12 fixture values; it does not execute Moriarty, produce or check a proof, or create a transaction or ledger state. The explorer\u2019s remove and restore control shows the consumer rule; a complete Web on this page is not proof verification, acceptance or settlement. Role cards state what each transition must prove; they do not claim fifteen independently implemented proof producers, and the supplied proof evidence concerns one invoice-partial relation. DEX, issuance and loan amounts are worked examples with no supplied source program; issuance additionally needs an application mint policy, which is distinct from the C2 claim policy. Identifiers shown in the explorer are placeholders. Cost: more Strands can duplicate context hashing, range constraints, exports, issuance and verification, and whole execution may be preferable; no measurement exists.",assumptions:[],evidenceStage:"Page scope",sourceRefs:["invoice-fixtures.json /description","scenarios.json","CONCEPT.md Optimization without assumed savings","ERR-15","CL-29","CL-30"]},{id:"scope-and-permission",title:"Permissionless use and retained scope",body:"Moriarty is a permissionless language of provable intention: any developer may author, compile, prove, publish and deploy programs in the supported language without approval from Moriarty maintainers, an agent council, Foreman, a hosted solver or a program registry. Objective validity rules, resource costs and asset-owner authorization still apply, and application-specific access control remains expressible without becoming a deployment restriction. Optional hosted proving, relaying or indexing services are never required. Moriarty's broader target remains Midnight ZKIRv3 and native proof infrastructure; Cardano is an additional experiment and does not replace that contract or qualify Midnight. Preview-first and later Preprod end-to-end acceptance remain required for claimed targets. No claim is made that a Cardano Web ports to another target unchanged.",retainedScope:{body:"One example does not establish compatibility. The wider language and evidence requirements remain open.",retainedFamilies:["S01","S02","S03","S04","escrow-time","interval-boundary","joint-role","oracle-observation","bilateral atomic escrow swap","constant-product exact rounding/slippage with serialized pool continuation","order execution versus timeout cancellation","two-order batch exact input coverage and injective output allocation / same-output double satisfaction","F01-origination","F02-interest-period","F03-partial-repayment-residual-liability","F04-fee-gross-net-policy","AP01","AP02","AP03","AP04"],familiesStatus:"Requirements, not supported ports.",actus:"277 fixtures, 18 executable types, 32 taxonomy dispositions and DS01\u201307.",defi:"72 rows, DA01\u201324, held-outs, intent cases and regressions.",furtherTracks:["General financial obligations","Universal property certificates","Authenticated history","Recursion","Private handoff","Bounded multiparent PCD"],target:"Midnight ZKIRv3 and native proof infrastructure remain the broader target; Cardano is an additional experiment.",qualification:"Preview-first and later Preprod end-to-end acceptance remain required for claimed targets.",catalogue:"235 pre-dedup review identifiers, not proven properties. Original 42/52 lists remain unrecovered. Required setup count is unknown."},evidenceStage:"Product contract (S03) and retained scope",sourceRefs:["S03 introduction, Product boundary, Execution target and certified basis, Verification versus project process","SECURITY-ERRATA approvedDraftClaims (permissionless tooling)","learning.json /broaderScope","S07 /allRequiredScopeRetained","CONCEPT.md Evidence appendix and retained breadth"]}],sourceRefs:[{label:"User v2 presentation steering",document:"moriarty-webs-react-draft-20261016/USER-V2-PRESENTATION-STEERING.json",pointer:"/verbatim, /interpretation"},{label:"Role06 security cards, glossary and invoice rules",document:"moriarty-webs-react-draft-20261016/contributions/06-security/SECURITY-COPY.json",pointer:"/cards, /glossaryClarifications, /invoiceRules"},{label:"Security errata ERR-01 to ERR-28",document:"moriarty-webs-ten-study-20261016/security-reviewed/SECURITY-ERRATA.json",pointer:"/rows, /approvedDraftClaims"},{label:"Invoice worksheet fixtures",document:"moriarty-webs-react-draft-20261016/contributions/04-scenarios/invoice-fixtures.json",pointer:"/opening, /partial, /fundingModes, /fixtures, /limitations"},{label:"Five use-case scenarios",document:"moriarty-webs-react-draft-20261016/contributions/04-scenarios/scenarios.json",pointer:"/0 to /4 strands"},{label:"Invoice source actions",document:"moriarty-webs-ten-study-20261016/sources/S12-installment-invoice.mori",pointer:"actions open, partial, finish"},{label:"Conditional reserve source",document:"moriarty-webs-ten-study-20261016/sources/S13-conditional-reserve.mori",pointer:"actions allocate, rebate"},{label:"Permissionless product contract",document:"reference-inputs/concept/sources/S03-MORIARTY-PRODUCT-CONTRACT.md",pointer:"Product boundary; Execution target and certified basis; Verification versus project process"},{label:"Integrated concept",document:"reference-inputs/concept/integrated-r2/CONCEPT.md",pointer:"How an application would use a Web; Five application cases; Optimization without assumed savings; Evidence appendix and retained breadth"},{label:"Retained broader scope",document:"moriarty-webs-react-draft-20261016/contributions/08-learning/learning.json",pointer:"/broaderScope"},{label:"S07 invoice-partial roundtrip",document:"moriarty-webs-ten-study-20261016/sources/S07-K6-ACTUAL-ADOPTION.json",pointer:"/scope, /limitations, /allRequiredScopeRetained"},{label:"S08 compiled C2 wrapper cases",document:"moriarty-webs-ten-study-20261016/sources/S08-K10-ACTUAL-ADOPTION.json",pointer:"/predicate, /cases, /scopeLimitations"},{label:"Conditional T1 adoption",document:"A01 public record",pointer:"/scope, /firstBlockedBoundary"}]}},groth16:{kicker:"Setups and counts",title:"How many Groth16 setups a Web needs",intro:"Every Strand carries a Groth16 proof. Groth16 keys belong to one compiled relation, so the number of setups follows the number of distinct compiled circuits, not the number of transactions, users or claims.",concepts:[{label:"Statement",title:"Public inputs",body:"The compiled relation fixes which values are public. Together they form the statement. They are not secret. A proof does not turn them into authenticated ledger facts: the validator rebuilds them from the transaction."},{label:"Witness",title:"Private values",body:"The witness is every other value that satisfies the constraints. The prover keeps it. The proof is zero-knowledge: it shows that the statement holds and reveals nothing else about the witness."},{label:"Proof and verification",title:"Keys, proof, verifier",body:"Setup for one relation outputs a proving key and a verification key. Both are public. The prover combines the proving key, the statement and the witness into a proof of three group elements. The verifier checks it against the verification key and the public inputs with one pairing-product equation."}],setupTitle:"How a setup usually runs",setupIntro:"Groth16 defines Setup as an algorithm over one relation. It does not prescribe a ceremony. A common practice splits the setup into two multi-party phases.",setupStages:[{label:"Phase 1",title:"Shared powers of tau",body:"This phase produces reusable parameters for one curve, up to a maximum constraint capacity. Any circuit on that curve that fits the capacity and uses a compatible format can build on it."},{label:"Phase 2",title:"One per compiled circuit",body:"Each exact compiled relation gets its own phase 2. The relation includes its constraints, its public-input layout and its bounds. The phase outputs that circuit's proving and verification keys."}],counter:{initial:5,min:1,max:20,kicker:"Hypothetical count",title:"Setup stages for K compatible circuits",body:"Choose a number of distinct compiled circuits that share one curve and one phase-1 capacity. This is arithmetic, not a deployed inventory.",label:"Distinct compiled circuits (K)",decreaseLabel:"Fewer circuits",increaseLabel:"More circuits",formula:"1 shared phase 1 + {K} phase 2",result:"{K} circuits need one shared phase 1 and {K} circuit-specific phase 2 stages. That counts stages; it does not mean {K} + 1 complete ceremonies.",conditions:"This holds only if every circuit uses the same curve, fits the phase-1 capacity and accepts its format, and only if each phase has a verified transcript with at least one honest participant."},reuseTitle:"What reuses a setup",reuseExamples:[{title:"Same relation, new values",body:"New transactions, users, assets and public-input values inside an unchanged compiled relation reuse its keys."},{title:"Changed relation",body:"A new relation needs its own phase 2. A relation changes when its constraints, compiled program, bounds or public-input layout change, or when another Groth16 wrapper is added. Aggregating proofs does not remove the base circuits' setups."},{title:"Bounded generic relations",body:"One parameterized relation with fixed bounds covers many claims without a new setup. It is not one unbounded circuit for all future Cardano applications."}],trustTitle:"What must stay secret",trust:"Proving and verification keys are public. The secret is the setup randomness, often called toxic waste. Anyone who holds it can produce verifying proofs for statements that have no witness, so it must not survive the setup. A multi-party phase is trustworthy when its transcript verifies and at least one participant in that phase was honest, under the protocol's assumptions. Every phase needs that property.",cardanoTitle:"The Cardano-wide count",cardanoCount:"The exact count is the number of distinct compiled circuits, including any wrappers, in a frozen circuit inventory. The 235 pre-dedup review identifiers, 20 families and seven layers describe review scope. None of them is a setup count. The circuit manifest is not frozen, so no total can be assigned yet.",technicalLinkLabel:"Implementation status: current test setup",sourceRefs:[{label:"Groth, On the Size of Pairing-based Non-interactive Arguments (EUROCRYPT 2016)",url:"https://eprint.iacr.org/2016/260",pointer:"\xA72.2 Setup(R), Sim; \xA73.2 construction and efficiency"},{label:"snarkjs README",url:"https://github.com/iden3/snarkjs",pointer:"Steps 1-8 (phase 1), 15-22 (Groth16 phase 2)"},{label:"Filecoin phase 2 attestations",url:"https://trusted-setup.filecoin.io",pointer:"Description of Trusted-Setup Phases"},{label:"Moriarty implementation status",url:"#implementation-status",pointer:"technical.trustNotes setup-keys"}]},sevenLayers:{kicker:"Proving Nothing \xB7 seven layers",title:"Seven layers of a Moriarty Web",intro:"Proving Nothing describes every zero-knowledge system through seven layers: interdependent concerns, not seven runtime phases that execute in order. Read through them, a Moriarty Web is one system: financial rules become constraints, a private witness satisfies them, Groth16 seals a proof for each Strand, and a Cardano consumer accepts the transition only when every required Strand matches the transaction it settles.",selectorLabel:"Choose a layer",panelLabel:"Layer detail",artifactLabel:"What this layer produces",dependenciesLabel:"Draws on layers",layers:[{number:1,name:"Setup",headline:"Keys made for one compiled relation",body:"Groth16 derives proving and verifying keys from secret randomness for one compiled circuit. Each distinct compiled relation needs its own setup; the count follows circuits, not predicates or catalogue entries. Whoever keeps that randomness can forge proofs, so soundness assumes it is destroyed.",artifact:"Proving key and verifying key",dependencies:[4,5,6],mapping:"Catalogue entries and owner intents name the verifying key."},{number:2,name:"Language",headline:"Financial rules written as a program",body:"Moriarty programs state what an action may do: payment arithmetic, fees kept separate from repayment, caps an owner signs, and duties that continue. The compiler turns that source into constraints; a rule left unconstrained is a rule no proof enforces.",artifact:"Moriarty source program",dependencies:[4],mapping:"Moriarty rules for payments, fees, caps and duties."},{number:3,name:"Witness",headline:"Every step, recorded by the prover",body:"The prover runs the program over its inputs and records every intermediate value. Zero-knowledge keeps this assignment hidden, but only the assignment: amounts that appear in Cardano outputs or in the statement stay public. Witness generation must not leak values through its own behavior.",artifact:"Full witness assignment",dependencies:[2,4],mapping:"One whole-execution witness can serve several Strand roles."},{number:4,name:"Arithmetization",headline:"Every rule becomes an equation",body:"The compiled program becomes rank-1 constraints over a prime field, which Groth16 encodes as a quadratic arithmetic program. A valid witness satisfies every constraint. The public inputs carry a statement digest; an in-circuit BLAKE2b gadget ties them to the statement bytes.",artifact:"R1CS matrices",dependencies:[2,5,6],mapping:"Caps, fees and duty updates become constraints."},{number:5,name:"Proof System",headline:"A short certificate of correct computation",body:"Groth16 turns the witness into a constant-size proof checked by one pairing equation. Under an honest setup, knowledge soundness means a verifying proof shows the prover knew a satisfying witness; zero-knowledge means the proof reveals nothing beyond its statement. It never shows the statement's values describe the real ledger.",artifact:"Groth16 proof",dependencies:[1,4,6],mapping:"Each Strand carries one proof."},{number:6,name:"Cryptographic Bedrock",headline:"Hard problems underneath",body:"A pairing-friendly elliptic curve supplies Groth16's groups and scalar field; Groth16's soundness argument holds in the generic bilinear group model. BLAKE2b collision resistance binds statement bytes to digests. Signatures authenticate owner intents and claimant releases. These primitives support the proof core and fix what it can express.",artifact:"Curve, hash and signature parameters",dependencies:[],mapping:"Cardano scripts evaluate the pairing check and hashes."},{number:7,name:"Verification",headline:"Proof meets ledger",body:"A claim policy checks each Groth16 proof and mints a proof-claim output. One settlement transaction consumes every Strand the Web requires; the validator rebuilds each statement from the transaction and spent state, requires claimant signatures and enforces signed caps. Outside facts need a named issuer, authentication path and freshness limit.",artifact:"Issue and settlement transactions",dependencies:[1,5,6],mapping:"All-or-nothing Web consumer on Cardano."}],relationshipsTitle:"How the layers lean on each other",relationships:["Layers 4, 5 and 6 form the proof core: the scalar field, the R1CS encoding and Groth16's pairing check are chosen as one design, not three.","Setup follows the compiled relation. Changing a rule changes the circuit, and a changed circuit needs a new setup and a new verifying key.","The proof and the ledger divide the work. Layers 3 to 5 show the statement's arithmetic is correct; Layer 7 checks, from the transaction itself, that the statement describes this step.","The verifier reaches down. Cardano scripts must run the pairing check, which constrains the curve and proof system beneath them.","The numbering follows how a reader meets the system, not the order of engineering decisions; the dependency lists here sketch the main pressures, not a complete graph."],mappingTitle:"From book layer to Moriarty Web",mappingHeaders:["Proving Nothing layer","In a Moriarty Web"],credit:"The seven-layer framework comes from Proving Nothing, cited at a pinned commit. The book explains zero-knowledge systems in general; the Moriarty mappings on this page are ours, not the book's.",sourceUrl:"https://github.com/CharlesHoskinson/sevenlayer/blob/2789e5a63972276e20bc6144733ef9824ced9e49/proving-nothing.md",sourceLabel:"Proving Nothing (sevenlayer, commit 2789e5a)",sourceRefs:[{label:"The Seven Layers at a Glance",url:"https://github.com/CharlesHoskinson/sevenlayer/blob/2789e5a63972276e20bc6144733ef9824ced9e49/proving-nothing.md?plain=1#L272-L298",pointer:"Lines 272\u2013298: the seven layers as interdependent organs"},{label:"Universal versus Circuit-Specific Setups",url:"https://github.com/CharlesHoskinson/sevenlayer/blob/2789e5a63972276e20bc6144733ef9824ced9e49/proving-nothing.md?plain=1#L609-L621",pointer:"Lines 609\u2013621: a Groth16 setup is specific to one circuit"},{label:"The Proof Core: Layers 4, 5, and 6",url:"https://github.com/CharlesHoskinson/sevenlayer/blob/2789e5a63972276e20bc6144733ef9824ced9e49/proving-nothing.md?plain=1#L2340-L2353",pointer:"Lines 2340\u20132353: separate concerns, joint implementation"},{label:"The Causal Web: Why It Is a DAG, Not a Stack",url:"https://github.com/CharlesHoskinson/sevenlayer/blob/2789e5a63972276e20bc6144733ef9824ced9e49/proving-nothing.md?plain=1#L4460-L4479",pointer:"Lines 4460\u20134479: upward and downward pressures between layers"},{label:"Groth, On the Size of Pairing-based Non-interactive Arguments (EUROCRYPT 2016)",url:"https://eprint.iacr.org/2016/260",pointer:"Sections 2.2 and 3.2: Setup(R), knowledge soundness, zero-knowledge, verification equation"}]},bookFindings:[{id:"F1",severity:"medium",summary:"On Cardano, zero-knowledge hides only the witness. Amounts in settlement outputs and in statements the validator rebuilds are public.",evidence:"V2-COPY proofRoleExplanation and lifecycle 'settle': the validator rebuilds each statement from the transaction and reads back the actual outputs. G05 \xA72.2: zero-knowledge covers the witness, not the statement.",requiredFix:"Copy must not say that transaction amounts are private. This is applied in Layer 3."},{id:"F2",severity:"low",summary:"The book and the Groth paper describe Groth16 verification differently.",evidence:"Book lines 609\u2013621 say 'two pairing checks\u2026 three distinct pairing computations'. G05 \xA73.2 says verification checks a single pairing product equation using 3 pairings.",requiredFix:"Copy follows the paper ('one pairing equation') and gives no pairing counts or proof sizes. The book passage could be fixed separately."},{id:"F3",severity:"low",summary:"Groth16 knowledge soundness is proven in the generic bilinear group model, not from discrete-log hardness alone. Claimant bytes are not an authenticated prover identity.",evidence:"G05 Theorem 3. V2-COPY binding-chain assumptions.",requiredFix:"Layer 6 names the generic bilinear group model. It says signatures authenticate claimant releases and does not call them prover identities."}]};var Ue=ie.v2.main,wh=Object.fromEntries(Ue.caseCopy.map(e=>[e.id,{...e,roles:Object.fromEntries(e.roles.map(t=>[t.id,t]))}])),c0=Ue.heroBody.slice(0,
