@media (forced-colors: active) {

  input[type='range'] { forced-color-adjust: auto; }
}
@media print {
  body { background: white; font-size: 10pt; }
  .site-nav, .hero-actions, .skip-link { display: none; }
  .shell, .page-shell, .container { width: 100%; }

  .hero { min-height: auto; padding-block: 2rem; }
  .hero h1 { font-size: 42pt; }
  .worksheet { color: black; background: white; border: 1px solid black; }
  .worksheet p, .worksheet .metric-label { color: black; }
  .explorer-layout, .worksheet-layout { break-inside: avoid; }
}

ies:11,backingGap:0,closingPaid:99,closingOpened:!0,preservedMarker:7}},{id:"proposed112-amount100",fundingMode:"proposed112",openingCash:112,amount:100,sourceWorksheetAdmitted:!1,expectation:"SOURCE_PARTIAL_REFUSED",reason:"Partial amount must be less than opening invoice duty; finish() is a separate action.",arithmeticStatus:"HYPOTHETICAL_ONLY_NO_SOURCE_VALID_PARTIAL",arithmetic:{sellerReceipt:100,feeRecipientReceipt:2,grossEscrowDebit:102,closingCash:10,closingInvoiceDuty:0,closingReserveDuty:10,totalClosingDuties:10,backingGap:0,closingPaid:100,closingOpened:!0,preservedMarker:7},expectedSourcePartialEffects:null}],limitations:["One step only. Each further partial has another 2 CASH source fee, so a sequence needs a further funding rule.","Amounts 0 and 100 are refused by partial against opening duty 100. Their arithmetic rows are hypothetical only.","finish() is a different source action: it transfers the closing invoice amount without the partial fee.","After source funding 110, partial(35), then finish(): cash is 8, invoice duty is present at zero, and reserve duty remains 10.","S12 contains no reserve-duty-return action.","Network fees, collateral, claim-output min-ADA, and the V2 thread reserve are separate from the worksheet\u2019s CASH source fees."]},maturity:"Moriarty Webs is a concept under review. Supplied records include one current-Rust invoice-partial Groth16 roundtrip and seven finite local compiled-C2-wrapper cases, with a single-party test setup and caller-fabricated proof contexts. Only a conditional lowering argument is adopted. V2 consumer descriptions are Opus readings of unadopted, uncompiled source, not observed behavior or exact-source correspondence to those runs. General Web integration, genuine intent authorization, onchain settlement, and all-family compatibility remain unestablished in this packet. Local VM cost is not ledger cost.",security:{format:"moriarty-webs-page-security-copy/1",statusScope:{status:"PROPOSED local draft security presentation strings",author:"role06 security copy; requested Opus 5.5 at HIGH effort. Actual provider, model and effort are recorded only by the wrapper.",scope:"Security and evidence wording for the local Webs and Strands explanatory page draft only, used together with SECURITY-ERRATA.json ERR-01 to ERR-28. Not security approval, mechanism adoption, implementation, product release, publication approval, operator readiness or native authority.",review:"Newly authored copy. It is not a review of any page. Fresh review of the actual integrated page remains pending: a nonauthor Muse editorial/result review and a separate Opus review of the exact final security wording. Any changed byte needs fresh applicable review.",sourceReadingCaveat:"Every V2 consumer or claim-policy description here is an Opus source-level reading of unadopted, uncompiled Aiken/Rust files. It is not observed compiled behavior and not exact-source evidence for the recorded S07 roundtrip or the S08 compiled C2-wrapper (K10) runs: no supplied record pins those binaries or compiled bytes to the reviewed source. The four-piece settle implementation and byte/type helpers were not supplied to the reviewer; four-piece reuse rests on S09 and source comments.",integrationRule:"Nonsecurity authors may quote a card, rule or string exactly, with its assumptions, evidenceStage and sourceRefs adjacent or one disclosure away, or omit it. Do not drop an assumption, upgrade a stage, merge cards into a broader claim, or add a security conclusion. New security wording needs an Opus referral.",stageLabels:{RECORDED:"Recorded observation in a supplied S07/S08 record; local and scoped, not ledger acceptance.",V2_SOURCE_READING:"Opus reading of unadopted, uncompiled V2 source; not observed behavior.",CONDITIONAL_ARGUMENT:"A01/A02 conditional source-design argument only (T1 modulo premises).",PROPOSED:"Design proposal; not adopted, implemented or enforced.",OPEN:"Unresolved; nothing in this packet closes it.",PREMISE:"Cardano ledger rule assumed; not contained in the sources.",ILLUSTRATION:"Page-local example data or state; no proof, transaction or ledger meaning."}},maturity:{title:"Current maturity",body:"Moriarty Webs is a concept under review. Supplied records include one current-Rust invoice-partial Groth16 roundtrip (S07) and seven finite local compiled-C2-wrapper cases (S08: one acceptance and six mutation rejections), with a single-party test setup whose operator can forge proofs and caller-fabricated proof contexts. No on-chain transaction is recorded. Only a conditional lowering argument is adopted. V2 consumer descriptions on this page are Opus readings of unadopted, uncompiled source, not observed behavior or exact-source correspondence to those runs. General Web integration, genuine intent authorization, onchain settlement and all-family compatibility remain unestablished in this packet. Local VM cost is not ledger cost. Every interactive example on this page is an illustration.",sourceRefs:["S07 /scope","S08 /predicate","S08 /scopeLimitations","A01 /scope","A03 \xA70","ERR-05","ERR-17","ERR-19","ERR-20","CL-11","CL-12","CL-13","CL-14","CL-15"]},cards:[{id:"proof-meaning",title:"What a verifying proof shows",body:"Under an honest setup and Groth16 knowledge soundness, a verifying proof shows the prover knew a witness satisfying the compiled constraints for its two public inputs. Linking those inputs to statement bytes additionally rests on the in-circuit BLAKE2b gadget and on BLAKE2b collision resistance. It never authenticates those bytes. A proof over supplied values does not make them an authenticated ledger fact or a true outside observation. A concrete execution proof, a universal property certificate and an authenticated ledger claim are different assertions; the latter two are not established Strand kinds.",assumptions:["The current class-0 test setup is forgeable by its operator, so no production security claim follows.","Whether the compiled constraints and verifying key match your source is OPEN (T3: compiled circuit/VK and BLAKE2b gadget correspondence).","Outside facts keep their named issuer, predicate, authentication path and freshness limits.","Reference-input reads are PROPOSED: the validator must read the datum itself and authenticate its origin. PREMISE: being unspent at application shows presence only, with no exclusivity or history. A validity interval neither dates nor authenticates a datum.","SEC06-P06 PROPOSED; still needs real-context stale-sequence and expired-attestation cases, changed-reference-datum and forged-origin negatives, N5/N7\u2013N9 at V, and a separately scoped real-context proof."],evidenceStage:"Assumption-bound Groth16 meaning; T3 OPEN; reference-input path PROPOSED",sourceRefs:["ERR-16","ERR-17","ERR-01","ERR-11","CL-27","CL-45","CL-49","S07 /limitations/universalPropertyCertificate","S07 /limitations/class0ControllerCanForge","SEC06-P06 PROPOSED"]},{id:"recorded-evidence",title:"What has actually been recorded",body:"Evidence layers (DEMO ONLY): H ordinary host tests captured (K4H, S04; fresh actual-result review pending) | N 1 local roundtrip (S07) | V 1 local C2 wrapper, 7 cases (S08) | P none. One genuine proof was accepted by a compiled C2 wrapper in a local VM with fabricated context (S08); no on-chain transaction is recorded. S08 /cases/0 records cpu 2222340191 and mem 205312 for the whole compiled C2 Issue evaluation, including its pairing; it is neither an isolated verification cost nor ledger ExUnits, fee or transaction fit. Every recorded proof context in the supplied sources is caller-fabricated (S07, S08).",assumptions:["No supplied record pins the recorded runs to the later V2 source bytes; V2 readings elsewhere on this page are not evidence about these runs.","Named runtime guards behind the six S08 rejections were not instrumented.","All 20 retained S02 families are requirements, not supported ports. The 235 catalogue IDs are pre-dedup review identifiers, not accepted or proven properties; the original 42/52 lists remain unrecovered.","Moriarty's broader target remains Midnight ZKIRv3 and native proof infrastructure; Cardano is an additional experiment and does not qualify Midnight. Preview-first and later Preprod end-to-end acceptance remain required for claimed targets.","SEC06-P08 PROPOSED (developer trust report); still needs a DEMO ONLY S07/S08 report with these qualified layers, fresh nonsecurity wording review and fresh security review. No new evidence is inferred from this layer wording."],evidenceStage:"RECORDED (local, scoped)",sourceRefs:["ERR-18","ERR-17","ERR-05","ERR-19","CL-11","CL-12","CL-13","CL-14","CL-31","CL-32","CL-33","CL-34","S07 /scope","S08 /cases","S08 /scopeLimitations","SEC06-P08 PROPOSED"]},{id:"setup-keys",title:"Setup and keys",body:"The current test setup can be forged by its operator; whether the verifying key matches the compiled relation is OPEN. Groth16 needs a separate setup per distinct compiled circuit (R1CS matrices), not per logical predicate. In the current Rust source the predicate digest is a circuit constant, so each distinct relation identity is a distinct circuit. The required total setup count is unknown; predicate, catalogue and family counts do not determine it. No production ceremony is recorded in the supplied sources, and none is proposed here.",assumptions:["A future universal circuit or Midnight's universal PLONK/KZG SRS would change the comparison (PROPOSED or target-specific).","V2 SOURCE READING: catalogue VK digests are fixed at genesis and carried unchanged, and Close requires zero balances and duties, so any key change needs a PROPOSED key migration action that carries residual duties.","Intent revocation (Revoke) advances seq; it is not key migration.","SEC06-P07 PROPOSED; still needs an old-VK-refused-after-migration negative, a setup-class report and independent review of any future ceremony."],evidenceStage:"RECORDED limitation (forgeable test setup); V2 SOURCE READING; total setup count UNKNOWN",sourceRefs:["ERR-14","ERR-28","ERR-17","CL-14","CL-32","CL-43","SEC06-P07 PROPOSED"]},{id:"binding-chain",title:"What ties a Strand to its step",body:"V2 SOURCE READING: tag, family, predicate_digest, shape_digest and body_len are circuit constants; the context fields vk_digest through intents_digest (bytes 112..339, including claimant_vkh) are free booleanized witness bits that are hashed, not interpreted. The consumer, not the circuit, ties those fields to the transaction: the settling validator rebuilds each statement from the transaction and the spent thread state, so a claim made for another thread step, catalogue, claimant or intent set does not match. Claimant binding happens at consumption, not at issuance: C2 Issue does not compare the claimant with the statement, so a mismatched envelope can be minted but cannot settle. This source-level binding is separate from T3, which stays OPEN.",assumptions:["The class-0 setup operator can forge a proof for any digest and any claimant. The claimant is prover-chosen bytes, not an authenticated prover identity.","Builders select claim inputs; the ledger spends each claim once (PREMISE). A copied proof can be re-issued with the same claimant and a new expiry; only that claimant can release it.","Catalogue program_hash and source_hash are visible, covered by catalogue_digest and signed in every owner intent. No on-chain check links them to predicate_digest or vk_digest: that link is a CATALOGUE-AUTHOR ASSERTION and VK-to-matrix is OPEN. Exact predicate-digest field coverage depends on identity.rs, which the reviewer did not read.","The statement's network byte is declared by the catalogue and not compared with the executing ledger; separation across networks rests on outref uniqueness (PREMISE).","SEC06-P03 and SEC06-P04 PROPOSED; still need competing-claimant and same-claimant duplicate negatives, second-party source\u2192relation\u2192predicate reproduction, refusal-list coverage, N5/N7\u2013N9, a T3 method, reviewed T2/T3 and F07\u2013F10, a non-test setup, and cross-network replay analysis if the network byte is relied on."],evidenceStage:"V2 SOURCE READING (unadopted, uncompiled); T3 OPEN",sourceRefs:["ERR-02","ERR-03","ERR-13","ERR-07","ERR-16","CL-36","CL-39","CL-40","CL-45","CL-46","SEC06-P03 PROPOSED","SEC06-P04 PROPOSED"]},{id:"issuance-route",title:"Where proofs are checked: the issuance route",body:"In the reviewed V2 source, each proof is checked when its claim is issued: the C2 claim policy checks a Groth16 proof and mints one claim output per Issue transaction. Claims must exist before settlement. The settlement transaction consumes them, recomputes each statement and compares it with the digest checked at issuance; it does not verify the proof again. Each consumed claim needs its claimant's signature on the settlement transaction and the burn of its token. Structurally, n required Strands mean n Issue transactions plus one settlement, excluding one-time genesis and any post-expiry reclaim. These counts are readings of uncompiled source, not measurements.",assumptions:["Each claim output locks min-ADA from issuance until settlement or claimant-signed reclaim after the claimant-chosen expiry. Several envelopes can exist per statement digest.","Safe but not live: any catalogue account may Revoke (advancing seq), and a competing settlement may spend the outref, orphaning issued claims and locking their value until expiry. Earlier reclaim is PROPOSED (OPEN).","Batch issuance needs a C2 change (PROPOSED). Proof-at-consumption is a different PROPOSED design needing a new redeemer and in-settlement pairings, with size and budget unmeasured. Mempool chaining is a node premise outside the sources.","V2 source already refuses two claims for one consumed outref; S09's role-level refusal is an unadopted proposal and not deduplication permission.","Owner intents are signed before proving; claimant settlement signatures are a later, distinct event. Proof collection or claim-output creation executes no effect.","Still needs orphan-after-Revoke, competing-settlement and post-expiry reclaim cases, and a qualified complete-path measurement of both verification placements."],evidenceStage:"V2 SOURCE READING (structural); not observed onchain",sourceRefs:["ERR-04","ERR-06","ERR-07","ERR-12","ERR-25","ERR-26","ERR-27","CL-02","CL-30","CL-47","CL-50","SEC06-P04 PROPOSED"]},{id:"web-completeness",title:"Complete and incomplete Webs",body:"PROPOSED: a Web settles only when every Strand its contract requires is present. An incomplete Web has no authority over thread effects. On the issuance route its already-issued claim outputs exist on-chain, lock value, and remain releasable only by their claimant. In the first proposed supported profile, the consumer refuses universal property certificates, authenticated-history claims, private handoff, recursive parents and multiparent joins as UNSUPPORTED; they remain required Web tracks, each needing its own trust path and evidence before any profile accepts it.",assumptions:["All-or-nothing acceptance and a consumer-derived required set are PROPOSED; no Web consumer, second genuine relation or general cardinality exists in this packet.","Depicting several Strand roles does not establish separate relations or producers. A whole-execution proof may cover several claim specifications; naming source expressions fee or liability does not create independent proof producers.","A01 adopts only conditional T1: the all-role conjunction equals whole-action Core over one decoded body, modulo premise G including output well-formedness, a covering WebPlan, whole-action compilation first and the same field. There is no implementation, no T2, no T3 and no full WP migration (F07\u2013F10); builder reliance is not permitted.","OPEN: whether a consumer can enforce a fully authorized partial financial step that carries every proof that step requires, distinct from a missing proof.","SEC06-P01 and SEC06-P02 PROPOSED; still need N1/N12 and unknown-class refusal, a report-level test that an incomplete set never renders as accepted, N1\u2013N4/N6/N11/N14 at H/V, a wrong-action-index case, a required-set display, separate future-profile designs and fresh security review of reused V2 mechanisms."],evidenceStage:"PROPOSED; CONDITIONAL_ARGUMENT for T1 only",sourceRefs:["ERR-01","ERR-15","ERR-10","ERR-20","ERR-27","CL-03","CL-15","CL-16","CL-17","CL-21","CL-37","CL-38","SEC06-P01 PROPOSED","SEC06-P02 PROPOSED"]},{id:"effects-authority",title:"Effects, allocation and authority",body:"V2 SOURCE READING: owner intents sign per-asset gross_cap, fee_cap, net_floor and liability_cap for a beneficiary, a validity window, nonce = seq and the target predicate, VK and shape digests. Duties change only through recorded accruals and discharges, and a thread with a nonzero duty cannot close. The thread datum carries the complete custody snapshot, which custody must equal exactly. Actual output allocation is the consuming validator's job; a proof can attest arithmetic only over values the validator recomputes. A profile chooses either strict one-output-per-obligation or a consumer-recomputed amount partition that admits coalesced payments, with every obligation allocated exactly once.",assumptions:["The source strict-output rule covers redeemers of one S2 script hash only, not other scripts or S2 versions. No input value may count toward two obligations; ledger single-spend alone is not a value partition.","Circuit-level NotBound/TouchedOnly limits remain. A general multi-UTxO authenticated frame, role sets, cross-script allocation and partial-completion rules are PROPOSED.","No genuine intent signature is observed in the supplied proof records.","A supplied approved=true is consented to by the effect-derived required signers, and by a listed advancer if any; that is the debited account's consent, not a separate governance decision. A distinct approver must be a required signer, an advancer or an authenticated input.","SEC06-P05 PROPOSED; still needs double-satisfaction negatives across scripts and S2 versions, a coalesced positive under partition, fee-over-cap and dropped-duty cases, the approver-coverage lint, a genuine validator-checked signature in real context, and independent custody/duty/backing accounting with a backing-policy negative."],evidenceStage:"V2 SOURCE READING; allocation policy PROPOSED per profile",sourceRefs:["ERR-08","ERR-09","ERR-10","ERR-23","ERR-24","CL-22","CL-25","CL-41","CL-48","CL-51","SEC06-P05 PROPOSED"]},{id:"duties-backing-fees",title:"Duties, backing and fees",body:"S12 and S13 source behavior requires non-negative custody, not full backing of liabilities. S12 funds escrow at 110: partial(35) debits 37 and leaves 73 against duties of 75 (invoice 65, reserve 10), which is 2 short. Funding 112 would back one partial; each further partial charges another 2 that no duty reflects. That backing is a PROPOSED application policy. S12 has no extra transfer and no reserve-duty-return action; after finish, escrow holds 8 against reserve duty 10, and the nonzero reserve duty blocks V2 Close. S13 allocate(true,23,7,2) needs at least 23 A and 4 B for non-negative custody; 25 A and 10 B is PROPOSED full backing, and S13 has no action discharging allocation_reserve.",assumptions:["Source-only arithmetic, not execution. The V2 Close zero-duty condition is an uncompiled-source reading.","Even under the proposed 112 policy the reserve duty stays 10 and Close stays blocked; discharge or migration needs a program change.","S13 units is checked only arithmetically (23 = 3\xD77 + 2) and is never debited.","A program-asset fee is not debt repayment and not a network fee. Network fees, collateral, claim-output min-ADA and the V2 thread reserve (lovelace returned on Close) are separate funding items; a reserve duty is a program liability.","Delivery evidence and dispute rules remain named assumptions. Still needs independent open/partial/finish/reserve-return accounting and a backing-policy negative."],evidenceStage:"Source arithmetic reading; full backing PROPOSED",sourceRefs:["ERR-21","ERR-22","ERR-25","ERR-28","CL-19","CL-20","CL-25","CL-26","CL-52","S12 actions","S13 action allocate","SEC06-P05 PROPOSED"]}],glossaryClarifications:[{term:"Strand",clarification:"An individual proof with its claim, statement and binding metadata. Before a proof exists, say requirement or planned proof. A signed owner intent, UTxO, claim output, validator, catalogue entry, pattern or predicate is not a Strand.",sourceRefs:["CL-04","ERR-28","A04 /glossary"]},{term:"Web",clarification:"PROPOSED: the contract-fixed set of required Strands for one transition, accepted all-or-nothing by the consuming validator in a supported profile. Profiles refuse unsupported classes; certificates, authenticated history, private handoff, recursion and bounded multiparent remain required future tracks.",sourceRefs:["ERR-01","CL-03"]},{term:"Claim specification",clarification:"The reusable type of a Strand; not itself a proof. Reusing a specification does not reuse a proof for changed state.",sourceRefs:["CL-05","ERR-28"]},{term:"Claim output",clarification:"V2 SOURCE READING: a C2 UTxO holding one token named H(envelope), minted after the claim policy's Groth16 check. It confers no authority by itself and is neither the proof nor its validator.",sourceRefs:["ERR-28","A04 /glossary"]},{term:"Verified at issuance / at consumption",clarification:"Issuance is the reviewed V2 route. Verification at consumption is PROPOSED and needs a new redeemer and in-settlement pairings.",sourceRefs:["ERR-04","ERR-12","ERR-26"]},{term:"Thread reserve / reserve duty",clarification:"Thread reserve is V2 lovelace returned on Close. A reserve duty is a program liability such as S12 reserve or S13 allocation_reserve.",sourceRefs:["ERR-28"]},{term:"Intent revocation (Revoke) / key migration",clarification:"Revoke advances seq to cancel outstanding intents and can orphan issued claims. Key migration (VK change) is PROPOSED; V2 catalogues are immutable.",sourceRefs:["ERR-06","ERR-14","ERR-28"]},{term:"Allocation policy",clarification:"A per-profile choice between strict one-output-per-obligation (reviewed V2 scope: one S2 script hash) and a consumer-recomputed amount partition.",sourceRefs:["ERR-08","ERR-23"]},{term:"thread (internal identifier)",clarification:"thread is a V2 source identifier for the consumer's state instance (thread id, thread effects, thread reserve). It is not a public synonym for Strand; public vocabulary is Web and Strand.",sourceRefs:["BRIEF item 1","ERR-28"]},{term:"Assembled (page state)",clarification:"ILLUSTRATION: every illustrated requirement has an illustrated Strand. It is not proof verification, acceptance or settlement.",sourceRefs:["PLAN interfaces note","ERR-15"]},{term:"Settlement",clarification:"Actual target-ledger acceptance of the authorized effects under the applicable conditions. Nothing on this page settles anything.",sourceRefs:["CONCEPT glossary"]},{term:"CATALOGUE-AUTHOR ASSERTION",clarification:"A link stated by the catalogue author and not checked on-chain, here between program_hash/source_hash and predicate_digest/vk_digest.",sourceRefs:["ERR-13"]},{term:"PREMISE",clarification:"A Cardano ledger rule assumed by the reasoning but not contained in the sources, for example single spending of an outref.",sourceRefs:["A03 \xA70"]}],diagramRules:[{id:"DR-01",rule:"When the explorer draws several illustrated Strand roles (for example three), show the label: Illustrated roles. Separate relations, their proof producers and a required-set consumer are unestablished. Drawing a role never implies an existing producer.",sourceRefs:["CONCEPT useful job","CL-17","SEC06-P02 PROPOSED","ERR-10"]},{id:"DR-02",rule:"Only proof-bearing items are drawn as Strands. Draw signed owner intents, UTxOs, claim outputs, validators, catalogue entries, patterns and predicates with a distinct shape and legend entry, never with the Strand symbol.",sourceRefs:["CL-04","ERR-28"]},{id:"DR-03",rule:"Incomplete state text: Incomplete required set (illustration). Under the PROPOSED all-or-nothing rule it has no authority over thread effects. Optional second line: On the issuance route, already-issued claim outputs could still exist on-chain, lock min-ADA and be releasable only by their claimant. Never use verified, valid, accepted, settled, success, a check icon or a settlement color for this state.",sourceRefs:["ERR-15","SEC06-P01 PROPOSED"]},{id:"DR-04",rule:"Restored state text: Illustrative set assembled. Not proof verification, not acceptance, not settlement. No success badge, check icon or celebratory motion, and visually distinct from any recorded-evidence treatment.",sourceRefs:["ERR-15","PLAN interfaces note"]},{id:"DR-05",rule:"A connection from a Strand to its consumer means required by (PROPOSED). Do not label it verifies, executes or triggers, and do not depict automatic output triggering, chaining, aggregation, recursion or batching.",sourceRefs:["CL-06","CL-07","ERR-04"]},{id:"DR-06",rule:"Issuance-route diagram order: owner intents signed \u2192 proof production \u2192 one Issue per Strand (C2 checks the proof, mints one claim output, locks min-ADA) \u2192 one settlement (consumes claim outputs, recomputes statements against the issuance-checked digest, each claimant signs, tokens burned) \u2192 separate observation of inclusion, finality and readback. Label it V2 SOURCE READING, structural, not observed. Draw proof-at-consumption only as a separate PROPOSED alternative.",sourceRefs:["ERR-04","ERR-12","ERR-25","ERR-26","CL-47"]},{id:"DR-07",rule:"Context provenance: label illustrated context values as supplied, unauthenticated unless a named authentication path is shown. No freshness badge from a validity interval, no network-authentication badge from the catalogue network byte, and the claimant shown as prover-chosen bytes, not an authenticated identity.",sourceRefs:["ERR-03","ERR-07","ERR-11","ERR-19"]},{id:"DR-08",rule:"Illustrative identifiers, digests and counts must read as obvious placeholders (for example illustrative-statement-01), never as real-looking hex. Recorded values such as the S07/S08 VK digest prefix or the K10 cpu/mem figures appear only in the evidence drawer with their recorded scope.",sourceRefs:["ERR-05","ERR-18","BRIEF item 2"]},{id:"DR-09",rule:"Financial partial progress (a duty remaining) and a missing required proof are separate states with separate controls. The invoice worksheet never changes Web completeness, and no proof badge appears in the worksheet.",sourceRefs:["CL-21","SEC06-P01 PROPOSED","SEC06-P05 PROPOSED"]},{id:"DR-10",rule:"Every security-relevant state (incomplete, illustrative assembled, PROPOSED, OPEN, recorded) is conveyed in text, not by color or motion alone.",sourceRefs:["ERR-15"]}],invoiceRules:[{id:"IR-01",rule:"Opening is a source reading, not an executed result: S12 open(90,10) gives invoice duty 100 (face = 90 + 10), reserve duty 10 and escrow 110 CASH. The buyer pays the 110 transfer plus a 3 CASH program-asset fee, a gross debit of 113. CASH is the S12 fixture asset (network oracle-unit), not a Cardano asset.",sourceRefs:["S12 action open","CL-19"]},{id:"IR-02",rule:"Slider domain: integers 1 to 99 inclusive. S12 partial requires amount > 0 and amount < opening, and opening is 100.",sourceRefs:["S12 action partial"]},{id:"IR-03",rule:"0 and 100 are refusals, not accepted source actions. If shown as test cases, label them Refused: requires amount > 0, and Refused: requires amount < opening (100). Paying the whole balance is the separate finish action, which charges no fee and is not part of this one-partial worksheet.",sourceRefs:["S12 action partial","S12 action finish"]},{id:"IR-04",rule:"Source behavior (S12, not executed): escrow debit = amount + 2; escrow cash = 110 \u2212 amount \u2212 2; invoice duty = 100 \u2212 amount; reserve duty = 10; total duties = 110 \u2212 amount. After one partial the source path is always 2 short of total duties. Example amount 35: debit 37, cash 73, duties 65 + 10 = 75. Never label this path fully backed.",sourceRefs:["ERR-22","CL-19","CL-52"]},{id:"IR-05",rule:"PROPOSED full-backing view: funding 112, cash = 112 \u2212 amount \u2212 2, which equals total duties after one partial. Label it PROPOSED application policy. S12 open funds exactly face + reserve and has no extra transfer, so 112 is not an S12 action, and the source enforces only non-negative custody, not backing.",sourceRefs:["ERR-22","CL-19","CL-26"]},{id:"IR-06",rule:"Funding 112 backs one partial only. Each further partial charges escrow another 2 that no duty reflects, so later fees create further gaps unless a further rule and funding are adopted.",sourceRefs:["ERR-22"]},{id:"IR-07",rule:"The 2 CASH fee goes to fees and is not debt repayment; the invoice duty falls only by the payment amount. Network fees, collateral, claim-output min-ADA and the V2 thread reserve are separate, unknown here and not included in the worksheet.",sourceRefs:["ERR-25","ERR-28","CL-19"]},{id:"IR-08",rule:"Reserve: S12 has no reserve-duty-return action, so reserve duty 10 remains. If finish is mentioned, the source path leaves cash 8 against reserve duty 10 (the proposed 112 path leaves 10 against 10), and the nonzero reserve duty blocks V2 Close either way. Never show closed, complete or reserve returned.",sourceRefs:["ERR-22","CL-20","CL-52"]},{id:"IR-09",rule:"The worksheet is a local arithmetic lesson. It does not execute Moriarty or a proof and creates no transaction or ledger state. A permitted partial step is intended to carry every proof required for that step (PROPOSED; consumer enforcement OPEN); remaining duty is not a missing proof.",sourceRefs:["BRIEF item 3","CL-21","SEC06-P01 PROPOSED","SEC06-P05 PROPOSED"]},{id:"IR-10",rule:"Required visible labels: Source behavior (S12, not executed) and PROPOSED full-backing policy, plus the explicit 2-short line on the source path.",sourceRefs:["ERR-22"]}],forbiddenPhrases:[{phrase:"trustless",instead:"State the named assumptions (honest setup, T3 OPEN, forgeable test setup).",sourceRefs:["A04 /notApprovedPhrases"]},{phrase:"proven on Cardano",instead:"One genuine proof was accepted by a compiled C2 wrapper in a local VM with fabricated context (S08); no on-chain transaction is recorded.",sourceRefs:["ERR-17"]},{phrase:"secure, security guarantee, guaranteed, audited, security-approved (unscoped)",instead:"Use the card text with its assumptions and evidence stage.",sourceRefs:["A03 \xA71","A03 \xA711"]},{phrase:"verified, valid, accepted or settled for an assembled or restored illustration",instead:"Illustrative set assembled. Not proof verification, not acceptance, not settlement.",sourceRefs:["ERR-15"]},{phrase:"Bring proof with the transaction",instead:"Bring the required proofs to the transition.",sourceRefs:["ERR-26"]},{phrase:"settlement verifies the proofs",instead:"Settlement recomputes each statement and compares it with the digest checked at issuance.",sourceRefs:["ERR-12"]},{phrase:"two extra transactions per Strand",instead:"One Issue transaction per required Strand plus one settlement (structural source reading).",sourceRefs:["ERR-04"]},{phrase:"a partial Web is off-chain only",instead:"An incomplete Web has no authority over thread effects; already-issued claim outputs can exist on-chain and lock value.",sourceRefs:["ERR-15"]},{phrase:"each output credited to exactly one obligation (unscoped)",instead:"Under this profile's allocation rule, no payment can be counted toward two obligations.",sourceRefs:["ERR-08"]},{phrase:"cannot be replayed on another network (as a statement property)",instead:"Separation across networks rests on outref uniqueness; the network byte is catalogue-declared.",sourceRefs:["ERR-07"]},{phrase:"fresh as of the validity interval",instead:"A validity interval bounds when the transaction may apply; it does not date or a
