[package]
name = "beta-native-ledger-consumer"
version = "0.1.0"
edition = "2024"

[dependencies]
ledger = { package = "midnight-ledger-v9", git = "https://github.com/midnightntwrk/midnight-ledger", rev = "9a8777c4d035fc7f38ae286bcf5f8656668efd9f", default-features = false, features = ["proof-verifying"] }
onchain-runtime = { package = "midnight-onchain-runtime", git = "https://github.com/midnightntwrk/midnight-ledger", rev = "9a8777c4d035fc7f38ae286bcf5f8656668efd9f" }
base-crypto = { package = "midnight-base-crypto", git = "https://github.com/midnightntwrk/midnight-ledger", rev = "9a8777c4d035fc7f38ae286bcf5f8656668efd9f" }
storage = { package = "midnight-storage", git = "https://github.com/midnightntwrk/midnight-ledger", rev = "9a8777c4d035fc7f38ae286bcf5f8656668efd9f" }
coin-structure = { package = "midnight-coin-structure", git = "https://github.com/midnightntwrk/midnight-ledger", rev = "9a8777c4d035fc7f38ae286bcf5f8656668efd9f" }
anyhow = "=1.0.104"
midnight-zkir = { git = "https://github.com/midnightntwrk/midnight-zkir", rev = "e82d81d25aabcc5f5092e2bd559083487f577914" }
serialize = { package = "midnight-serialize", version = "=1.2.0" }
transient-crypto = { package = "midnight-transient-crypto", version = "=3.0.0" }

tokio = { version = "=1.53.1", default-features = false, features = ["rt"] }
rand = "=0.8.7"
sha2 = "=0.11.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[patch.crates-io]
midnight-base-crypto = { git = "https://github.com/midnightntwrk/midnight-ledger", rev = "9a8777c4d035fc7f38ae286bcf5f8656668efd9f" }
midnight-serialize = { git = "https://github.com/midnightntwrk/midnight-ledger", rev = "9a8777c4d035fc7f38ae286bcf5f8656668efd9f" }
midnight-transient-crypto = { git = "https://github.com/midnightntwrk/midnight-ledger", rev = "9a8777c4d035fc7f38ae286bcf5f8656668efd9f" }
midnight-storage-core = { git = "https://github.com/midnightntwrk/midnight-ledger", rev = "9a8777c4d035fc7f38ae286bcf5f8656668efd9f" }

# Required by official ledger v9 legacy proof verification compatibility.
midnight-transient-crypto-old = { package = "midnight-transient-crypto", git = "https://github.com/midnightntwrk/midnight-ledger", rev = "a01a1ea0270d2e8a1f9a58f0e3cf5ceb029283e1" }
