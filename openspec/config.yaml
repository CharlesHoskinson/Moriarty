schema: spec-driven

context: |
  Language: English
  All artifacts must be written in English.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.
  Apply ASD-STE100 Simplified Technical English to instructions.
  Keep each procedural instruction at 20 words or fewer.
  Use one instruction per sentence.
  Bind material claims to a source, commit, receipt, or preserved experiment.
  Use the S0 through S7 lifecycle taxonomy from WIKI_SCHEMA.md.
  Distinguish specified-only work from reproduced work.
  Treat generated Compact, ZKIR, Runtime, or external services as untrusted until checked.

rules:
  proposal:
    - State why the package can change the day-90 decision.
    - Name affected repository artifacts and explicit non-goals.
    - Do not describe planned work as implemented.
  specs:
    - Express acceptance and stop conditions as SHALL requirements.
    - Include at least one negative or failure scenario.
    - Require provenance for external evidence and deterministic reproduction for measurements.
  design:
    - State inputs, outputs, dependencies, trust boundaries, and failure handling.
    - Separate semantic guarantees from backend and operational feasibility.
  tasks:
    - Give exact output paths and verification commands.
    - Add tests before behavioral code changes.
    - Keep incomplete work unchecked.

operations:
  apply:
    guidance:
      - Preserve unrelated user changes.
      - Stop when a package gate fails.
      - Record the approved fallback instead of widening scope.
  archive:
    guidance:
      - Archive only after deterministic verification and evidence reconciliation.
