[package]
name = "mori-k2-driver"
version = "0.1.0-k2s1"
edition = "2024"
# Same toolchain floor as mori-core (workspace rust-version 1.99, rust-toolchain.toml 1.99.0).
rust-version = "1.99"
license = "Apache-2.0"
publish = false
description = "UNADOPTED K2 driver: admitted moriarty/1 source -> actual mori-r1cs SettlementHashV2 relation -> Groth16/BLS12-381 setup, proof, verification and Cardano-facing exports. Source only; never built, tested or run."

# Standalone root: not a member of the Moriarty workspace or of the R1 crate.
[workspace]

[lib]
name = "mori_k2_driver"
path = "src/lib.rs"

[[bin]]
name = "mori-k2"
path = "src/main.rs"

[dependencies]
# Actual compiler and Core, by path, in the proposed execution layout
# <root>/{moriarty,r1cs,k2}. No identity of either is copied into this crate.
mori-r1cs = { path = "../r1cs/source/mori-r1cs" }
mori-core = { path = "../moriarty/crates/mori-core" }
# arkworks 0.4 line at the versions of the R1 lock (r1cs-r1.Cargo.lock). Default features stay
# off as in mori-r1cs: no `parallel`, hence no rayon.
ark-ff = { version = "=0.4.2", default-features = false }
ark-ec = { version = "=0.4.2", default-features = false }
ark-serialize = { version = "=0.4.2", default-features = false }
ark-relations = { version = "=0.4.0", default-features = false }
ark-bls12-381 = { version = "=0.4.0", default-features = false, features = ["curve"] }
ark-groth16 = { version = "=0.4.0", default-features = false }
# OsRng only (getrandom). rand_core 0.6.4 and getrandom 0.2.17 are already in the R1 lock.
rand_core = { version = "=0.6.4", features = ["getrandom"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[features]
default = []
# Compiles tests/crypto_tier.rs. Those tests are also #[ignore]: running them needs
# `--features crypto-authority -- --ignored` and separate crypto/native authority.
crypto-authority = []
