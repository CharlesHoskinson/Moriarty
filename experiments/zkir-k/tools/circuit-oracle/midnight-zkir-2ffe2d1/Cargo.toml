[package]
name = "zkir-circuit-oracle"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
midnight-zkir = { path = "../zkir" }
transient-crypto = { version = "3.0.0", package = "midnight-transient-crypto" }
midnight-proofs = { version = "^0.8.1" }
midnight-zk-stdlib = { version = "^2.3.5" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
num-bigint = "0.4"
rand = "^0.8.0"
rand_chacha = "^0.3.1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
