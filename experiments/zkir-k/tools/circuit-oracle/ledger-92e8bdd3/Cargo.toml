[package]
name = "zkir-circuit-oracle"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
midnight-zkir-v3 = { path = "../zkir-v3" }
transient-crypto = { path = "../transient-crypto", package = "midnight-transient-crypto" }
midnight-proofs = { version = "^0.8.1" }
midnight-zk-stdlib = { version = "^2.3.3" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
num-bigint = "0.4"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
