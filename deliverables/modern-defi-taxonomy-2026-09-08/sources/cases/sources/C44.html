              <h1><a name="p-56240-summary-1" class="anchor" href="#p-56240-summary-1" aria-label="Heading link"></a><strong>Summary</strong></h1>
<p>A proposal to:</p>
<ul>
<li>Increase PT-sUSDE-31JUL2025’s supply cap on the Ethereum Core instance.</li>
<li>Increase PT-eUSDE-29MAY2025’s supply cap on the Ethereum Core instance.</li>
</ul>
<p>All increases are backed by <a href="https://cdn.sanity.io/files/zmh9mnff/production/130e1060165f7ab0766bb4c70cc2ec41c1d1e458.pdf" rel="noopener nofollow ugc">Chaos Labs’ risk simulations</a>, which consider user behavior, on-chain liquidity, and price impact, ensuring that higher caps do not introduce additional risk to the platform.</p>
<h2><a name="p-56240-pt-susde-31jul2025-ethereum-core-2" class="anchor" href="#p-56240-pt-susde-31jul2025-ethereum-core-2" aria-label="Heading link"></a>PT-sUSDE-31JUL2025 (Ethereum Core)</h2>
<p>PT-sUSDE-31JUL2025 has reached its full supply cap utilization 3 days after the cap was raised.</p>
<p><div class="lightbox-wrapper"><a class="lightbox" href="https://europe1.discourse-cdn.com/flex013/uploads/aave/original/2X/8/801010eba285e45934069b68ea0649223f25980f.png" data-download-href="/uploads/short-url/igTxkNq5Iu35nvtYvq0mRtLC5rh.png?dl=1" title="Screenshot 2025-05-15 at 13.24.55" rel="noopener nofollow ugc"><img src="https://europe1.discourse-cdn.com/flex013/uploads/aave/original/2X/8/801010eba285e45934069b68ea0649223f25980f.png" alt="Screenshot 2025-05-15 at 13.24.55" data-base62-sha1="igTxkNq5Iu35nvtYvq0mRtLC5rh" width="623" height="152"><div class="meta"><svg class="fa d-icon d-icon-far-image svg-icon" aria-hidden="true"><use href="#far-image"></use></svg><span class="filename">Screenshot 2025-05-15 at 13.24.55</span><span class="informations">623×152 7.03 KB</span><svg class="fa d-icon d-icon-discourse-expand svg-icon" aria-hidden="true"><use href="#discourse-expand"></use></svg></div></a></div></p>
<p><div class="lightbox-wrapper"><a class="lightbox" href="https://europe1.discourse-cdn.com/flex013/uploads/aave/original/2X/1/1a7498462ac3885e5d7ff23adb5451943fbc71e7.png" data-download-href="/uploads/short-url/3M2du0fVRnG7SHSvQp9hPMSYEqX.png?dl=1" title="Screenshot 2025-05-15 at 13.25.31" rel="noopener nofollow ugc"><img src="https://europe1.discourse-cdn.com/flex013/uploads/aave/original/2X/1/1a7498462ac3885e5d7ff23adb5451943fbc71e7.png" alt="Screenshot 2025-05-15 at 13.25.31" data-base62-sha1="3M2du0fVRnG7SHSvQp9hPMSYEqX" width="1251" height="437"><div class="meta"><svg class="fa d-icon d-icon-far-image svg-icon" aria-hidden="true"><use href="#far-image"></use></svg><span class="filename">Screenshot 2025-05-15 at 13.25.31</span><span class="informations">1251×437 15.8 KB</span><svg class="fa d-icon d-icon-discourse-expand svg-icon" aria-hidden="true"><use href="#discourse-expand"></use></svg></div></a></div></p>
<h3><a name="p-56240-supply-distribution-3" class="anchor" href="#p-56240-supply-distribution-3" aria-label="Heading link"></a>Supply Distribution</h3>
<p>Following the recent supply cap increase, the supply concentration of the largest position has improved, with its share dropping from 35% to 24% of the total supply. Additionally, all the top positions continue to borrow USDC and USDT, which are both highly correlated with PT-sUSDE, further mitigating the risk of liquidations.</p>
<p><div class="lightbox-wrapper"><a class="lightbox" href="https://europe1.discourse-cdn.com/flex013/uploads/aave/original/2X/c/cf3fd391a2c74826ae144f6d62b3a94352be1bd2.png" data-download-href="/uploads/short-url/tzpAcwdexUUi9fXwlk7YsGdIqKm.png?dl=1" title="Screenshot 2025-05-15 at 13.26.51" rel="noopener nofollow ugc"><img src="https://europe1.discourse-cdn.com/flex013/uploads/aave/original/2X/c/cf3fd391a2c74826ae144f6d62b3a94352be1bd2.png" alt="Screenshot 2025-05-15 at 13.26.51" data-base62-sha1="tzpAcwdexUUi9fXwlk7YsGdIqKm" width="1250" height="533"><div class="meta"><svg class="fa d-icon d-icon-far-image svg-icon" aria-hidden="true"><use href="#far-image"></use></svg><span class="filename">Screenshot 2025-05-15 at 13.26.51</span><span class="informations">1250×533 30.8 KB</span><svg class="fa d-icon d-icon-discourse-expand svg-icon" aria-hidden="true"><use href="#discourse-expand"></use></svg></div></a></div></p>
<p>The distribution of total borrowed assets is highly concentrated in stablecoins, with zero exposure to other assets.</p>
<p><div class="lightbox-wrapper"><a class="lightbox" href="https://europe1.discourse-cdn.com/flex013/uploads/aave/original/2X/0/0c29a3cc16123d4ec87bb2630c6d659ffb297d36.png" data-download-href="/uploads/short-url/1JAWrgdlRsJAfW6T3enxKk3qGDY.png?dl=1" title="Screenshot 2025-05-15 at 13.45.07" rel="noopener nofollow ugc"><img src="https://europe1.discourse-cdn.com/flex013/uploads/aave/original/2X/0/0c29a3cc16123d4ec87bb2630c6d659ffb297d36.png" alt="Screenshot 2025-05-15 at 13.45.07" data-base62-sha1="1JAWrgdlRsJAfW6T3enxKk3qGDY" width="1246" height="529"><div class="meta"><svg class="fa d-icon d-icon-far-image svg-icon" aria-hidden="true"><use href="#far-image"></use></svg><span class="filename">Screenshot 2025-05-15 at 13.45.07</span><span class="informations">1246×529 29.8 KB</span><svg class="fa d-icon d-icon-discourse-expand svg-icon" aria-hidden="true"><use href="#discourse-expand"></use></svg></div></a></div></p>
<h3><a name="p-56240-liquidity-market-4" class="anchor" href="#p-56240-liquidity-market-4" aria-label="Heading link"></a>Liquidity &amp; Market</h3>
<p>Backed by on-chain liquidity in the Pendle AMM, the PT-sUSDE-31JUL2025 market currently supports swaps of up to 55M sUSDe with under 3% slippage.</p>
<p><div class="lightbox-wrapper"><a class="lightbox" href="https://europe1.discourse-cdn.com/flex013/uploads/aave/original/2X/f/f184145f4b43beb767aa9d97aff1915fab9cc4f3.png" data-download-href="/uploads/short-url/ysy34ye7kE8nUpA9OINdqN0T2QH.png?dl=1" title="image" rel="noopener nofollow ugc"><img src="https://europe1.discourse-cdn.com/flex013/uploads/aave/original/2X/f/f184145f4b43beb767aa9d97aff1915fab9cc4f3.png" alt="image" data-base62-sha1="ysy34ye7kE8nUpA9OINdqN0T2QH" width="1000" height="800"><div class="meta"><svg class="fa d-icon d-icon-far-image svg-icon" aria-hidden="true"><use href="#far-image"></use></svg><span class="filename">image</span><span class="informations">1000×800 91 KB</span><svg class="fa d-icon d-icon-discourse-expand svg-icon" aria-hidden="true"><use href="#discourse-expand"></use></svg></div></a></div></p>
<p>The on-chain liquidity for the asset has been in an upward trend, with total SY liquidity increasing from 40 million to 55 million in recent weeks.</p>
<p><div class="lightbox-wrapper"><a class="lightbox" href="https://europe1.discourse-cdn.com/flex013/uploads/aave/original/2X/7/73572c2abc24556ceca97ad975aeccc81f3282b2.png" data-download-href="/uploads/short-url/gslFS9Rj7QaeLzUXqyYUqKIUSFI.png?dl=1" title="image (1)" rel="noopener nofollow ugc"><img src="https://europe1.discourse-cdn.com/flex013/uploads/aave/original/2X/7/73572c2abc24556ceca97ad975aeccc81f3282b2.png" alt="image (1)" data-base62-sha1="gslFS9Rj7QaeLzUXqyYUqKIUSFI" width="720" height="576"><div class="meta"><svg class="fa d-icon d-icon-far-image svg-icon" aria-hidden="true"><use href="#far-image"></use></svg><span class="filename">image (1)</span><span class="informations">720×576 64.8 KB</span><svg class="fa d-icon d-icon-discourse-expand svg-icon" aria-hidden="true"><use href="#discourse-expand"></use></svg></div></a></div></p>
<p>The PT-sUSDE market has shown consistent yield growth over the past few days, reaching a peak of 9.8% before settling around 9.2% currently.</p>
<p><div class="lightbox-wrapper"><a class="lightbox" href="https://europe1.discourse-cdn.com/flex013/uploads/aave/original/2X/1/1830ac4545227f2dc67970dc3aaf787d842860d2.png" data-download-href="/uploads/short-url/3rZJUJKT0TIU1jGlxLN5t7wQ0n0.png?dl=1" title="Screenshot 2025-05-15 at 13.51.36" rel="noopener nofollow ugc"><img src="https://europe1.discourse-cdn.com/flex013/uploads/aave/original/2X/1/1830ac4545227f2dc67970dc3aaf787d842860d2.png" alt="Screenshot 2025-05-15 at 13.51.36" data-base62-sha1="3rZJUJKT0TIU1jGlxLN5t7wQ0n0" width="1009" height="514"><div class="meta"><svg class="fa d-icon d-icon-far-image svg-icon" aria-hidden="true"><use href="#far-image"></use></svg><span class="filename">Screenshot 2025-05-15 at 13.51.36</span><span class="informations">1009×514 22.3 KB</span><svg class="fa d-icon d-icon-discourse-expand svg-icon" aria-hidden="true"><use href="#discourse-expand"></use></svg></div></a></div></p>
<h3><a name="p-56240-recommendation-5" class="anchor" href="#p-56240-recommendation-5" aria-label="Heading link"></a>Recommendation</h3>
<p>Given user behavior, the market’s liquidity, and the high demand for the asset, we recommend increasing the supply cap by 110M PT-sUSDE-31JUL2025.</p>
<h2><a name="p-56240-pt-eusde-29may2025-ethereum-core-6" class="anchor" href="#p-56240-pt-eusde-29may2025-ethereum-core-6" aria-label="Heading link"></a>PT-eUSDE-29MAY2025 (Ethereum Core)</h2>
<p>PT-eUSDE-29MAY2025’s supply cap utilization has reached 94%.</p>
<p><div class="lightbox-wrapper"><a class="lightbox" href="https://europe1.discourse-cdn.com/flex013/uploads/aave/original/2X/7/702da828927af36811c048239eda834503fbf483.png" data-download-href="/uploads/short-url/g0nim8qM7imugfcL3JLW0TYa6wr.png?dl=1" title="Screenshot 2025-05-15 at 13.33.16" rel="noopener nofollow ugc"><img src="https://europe1.discourse-cdn.com/flex013/uploads/aave/original/2X/7/702da828927af36811c048239eda834503fbf483.png" alt="Screenshot 2025-05-15 at 13.33.16" data-base62-sha1="g0nim8qM7imugfcL3JLW0TYa6wr" width="604" height="178"><div class="meta"><svg class="fa d-icon d-icon-far-image svg-icon" aria-hidden="true"><use href="#far-image"></use></svg><span class="filename">Screenshot 2025-05-15 at 13.33.16</span><span class="informations">604×178 7.9 KB</span><svg class="fa d-icon d-icon-discourse-expand svg-icon" aria-hidden="true"><use href="#discourse-expand"></use></svg></div></a></div></p>
<p><div class="lightbox-wrapper"><a class="lightbox" href="https://europe1.discourse-cdn.com/flex013/uploads/aave/original/2X/2/20611cfdf4cf4c5e086880e9ee2946821971ee5a.png" data-download-href="/uploads/short-url/4Crlho2V35XpeE2Yvdi4HeAdygq.png?dl=1" title="Screenshot 2025-05-15 at 13.34.05" rel="noopener nofollow ugc"><img src="https://europe1.discourse-cdn.com/flex013/uploads/aave/original/2X/2/20611cfdf4cf4c5e086880e9ee2946821971ee5a.png" alt="Screenshot 2025-05-15 at 13.34.05" data-base62-sha1="4Crlho2V35XpeE2Yvdi4HeAdygq" width="1251" height="440"><div class="meta"><svg class="fa d-icon d-icon-far-image svg-icon" aria-hidden="true"><use href="#far-image"></use></svg><span class="filename">Screenshot 2025-05-15 at 13.34.05</span><span class="informations">1251×440 16.1 KB</span><svg class="fa d-icon d-icon-discourse-expand svg-icon" aria-hidden="true"><use href="#discourse-expand"></use></svg></div></a></div></p>
<h3><a name="p-56240-supply-distribution-7" class="anchor" href="#p-56240-supply-distribution-7" aria-label="Heading link"></a>Supply Distribution</h3>
<p>The asset’s distribution is moderately concentrated, with the largest supplier holding around 15% of the total supply. However, this position is not a significant concern at the moment, as it is primarily borrowing USDT, which has a strong correlation with PT-eUSDE.</p>
<p><div class="lightbox-wrapper"><a class="lightbox" href="https://europe1.discourse-cdn.com/flex013/uploads/aave/original/2X/9/91de9f120d19f7f3a82a2361fc368a7511ba0713.png" data-download-href="/uploads/short-url/kOqcepQktH9ofHsEXAZecDOxfQ7.png?dl=1" title="Screenshot 2025-05-15 at 13.34.23" rel="noopener nofollow ugc"><img src="https://europe1.discourse-cdn.com/flex013/uploads/aave/original/2X/9/91de9f120d19f7f3a82a2361fc368a7511ba0713.png" alt="Screenshot 2025-05-15 at 13.34.23" data-base62-sha1="kOqcepQktH9ofHsEXAZecDOxfQ7" width="1252" height="534"><div class="meta"><svg class="fa d-icon d-icon-far-image svg-icon" aria-hidden="true"><use href="#far-image"></use></svg><span class="filename">Screenshot 2025-05-15 at 13.34.23</span><span class="informations">1252×534 31.1 KB</span><svg class="fa d-icon d-icon-discourse-expand svg-icon" aria-hidden="true"><use href="#discourse-expand"></use></svg></div></a></div></p>
<p>The remaining suppliers also do not present significant risk, as they are borrowing USDT and USDC assets that are highly correlated with PT-eUSDE, thereby substantially reducing liquidation risk.</p>
<p>Currently, 66% of PT-collateralized debt is denominated in USDT, which significantly reduces the risk of large-scale liquidations.</p>
<p><div class="lightbox-wrapper"><a class="lightbox" href="https://europe1.discourse-cdn.com/flex013/uploads/aave/original/2X/6/6b86c63bbc9f48a0d70083b720338146c368e977.png" data-download-href="/uploads/short-url/fldQcPSjvnFDsYUokM3F6vb61wj.png?dl=1" title="Screenshot 2025-05-15 at 13.34.58" rel="noopener nofollow ugc"><img src="https://europe1.discourse-cdn.com/flex013/uploads/aave/original/2X/6/6b86c63bbc9f48a0d70083b720338146c368e977.png" alt="Screenshot 2025-05-15 at 13.34.58" data-base62-sha1="fldQcPSjvnFDsYUokM3F6vb61wj" width="1255" height="535"><div class="meta"><svg class="fa d-icon d-icon-far-image svg-icon" aria-hidden="true"><use href="#far-image"></use></svg><span class="filename">Screenshot 2025-05-15 at 13.34.58</span><span class="informations">1255×535 32.2 KB</span><svg class="fa d-icon d-icon-discourse-expand svg-icon" aria-hidden="true"><use href="#discourse-expand"></use></svg></div></a></div></p>
<h3><a name="p-56240-liquidity-market-8" class="anchor" href="#p-56240-liquidity-market-8" aria-label="Heading link"></a>Liquidity &amp; Market</h3>
<p>Backed by on-chain liquidity in the Pendle AMM, the PT-eUSDE-29MAY2025 market currently supports swaps of up to 175M with under 3% slippage.</p>
<p><div class="lightbox-wrapper"><a class="lightbox" href="https://europe1.discourse-cdn.com/flex013/uploads/aave/original/2X/4/41564ffc02242e17488cb7fda99dca24e19371ec.png" data-download-href="/uploads/short-url/9jZXsSQ5nq8o9NsOL6oHKMI5jJy.png?dl=1" title="image (2)" rel="noopener nofollow ugc"><img src="https://europe1.discourse-cdn.com/flex013/uploads/aave/original/2X/4/41564ffc02242e17488cb7fda99dca24e19371ec.png" alt="image (2)" data-base62-sha1="9jZXsSQ5nq8o9NsOL6oHKMI5jJy" width="1000" height="800"><div class="meta"><svg class="fa d-icon d-icon-far-image svg-icon" aria-hidden="true"><use href="#far-image"></use></svg><span class="filename">image (2)</span><span class="informations">1000×800 76.4 KB</span><svg class="fa d-icon d-icon-discourse-expand svg-icon" aria-hidden="true"><use href="#discourse-expand"></use></svg></div></a></div></p>
<h3><a name="p-56240-recommendation-9" class="anchor" href="#p-56240-recommendation-9" aria-label="Heading link"></a>Recommendation</h3>
<p>Given the market’s liquidity, overall safe user behavior, and the asset’s approaching maturity, we recommend increasing the supply cap by 180 million PT-eUSDE-29MAY2025.</p>
