[package]
name = "mori-gpu"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "GPU backend (BLS12-381 MSM, NTT, quotient) for the Sherlock wrap prover; CPU fallback when off"
build = "build.rs"

[features]
default = []
# Build the CUDA core with nvcc (CUDA 13.4, sm_121 by default; MORI_GPU_ARCH overrides).
cuda = []

[dependencies]
midnight-curves = "=0.3.1"
blst = "=0.3.17"
ff = "=0.13.1"
group = "=0.13.0"

[dev-dependencies]
rand = "=0.8.8"
rand_chacha = "=0.3.1"
rayon = "1"
