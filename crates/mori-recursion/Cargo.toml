[package]
name = "mori-recursion"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
sherlock-rollup-prefix = ["sherlock-rollup"]
sherlock-rollup = ["sherlock-recursion"]
sherlock-ledger-validation = [
    "sherlock-ledger", "dep:midnight-ledger", "dep:midnight-base-crypto", "dep:midnight-onchain-runtime",
]
sherlock-ledger = [
    "sherlock-recursion", "dep:midnight-onchain-state", "dep:midnight-storage", "dep:midnight-serialize", "dep:midnight-transient-crypto",
]
sherlock-recursion = [
    "dep:ff", "dep:group", "dep:hex", "dep:num-bigint", "dep:rand",
    "dep:rand_chacha", "dep:sha2", "dep:serde", "dep:serde_json", "dep:midnight-curves",
    "dep:num-integer", "dep:num-traits", "dep:blake2b_simd",
    "dep:midnight-proofs", "dep:midnight-circuits", "dep:midnight-zk-stdlib",
]

[dependencies]
midnight-ledger = { workspace = true, optional = true, features = ["proof-verifying"] }
midnight-base-crypto = { workspace = true, optional = true }
midnight-onchain-runtime = { workspace = true, optional = true }
ff = { workspace = true, optional = true }
group = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
num-bigint = { workspace = true, optional = true }
num-integer = { workspace = true, optional = true }
num-traits = { workspace = true, optional = true }
blake2b_simd = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
rand_chacha = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
midnight-curves = { workspace = true, optional = true }
midnight-proofs = { workspace = true, optional = true, features = ["circuit-params", "committed-instances"] }
midnight-circuits = { workspace = true, optional = true }
midnight-zk-stdlib = { workspace = true, optional = true }
midnight-onchain-state = { workspace = true, optional = true }
midnight-storage = { workspace = true, optional = true }
midnight-serialize = { workspace = true, optional = true }
midnight-transient-crypto = { workspace = true, optional = true }

[dev-dependencies]
mori-backend.workspace = true
mori-core.workspace = true

[[test]]
name = "sherlock_rollup"
required-features = ["sherlock-rollup"]

[[test]]
name = "sherlock_parent"
required-features = ["sherlock-recursion"]

[[test]]
name = "sherlock_terminal"
required-features = ["sherlock-ledger"]

[[example]]
name = "rollup_call"
required-features = ["sherlock-rollup", "sherlock-ledger"]

[[example]]
name = "rollup"
required-features = ["sherlock-rollup"]

[[example]]
name = "contract_key"
required-features = ["sherlock-ledger"]

[[example]]
name = "verify_chain"
required-features = ["sherlock-ledger"]

[[example]]
name = "validate_call"
required-features = ["sherlock-ledger-validation"]

[[bin]]
name = "sherlock-verify-parent"
path = "src/bin/sherlock_verify_parent.rs"
required-features = ["sherlock-recursion"]
