[package]
name = "mori-chip"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Chiplet leaf spike for the Sherlock VM: CORE, ALU with RANGE, MEM and DEC behind one lookup bus"
publish = false

[dependencies]
ff.workspace = true
midnight-curves.workspace = true
midnight-proofs = { workspace = true, features = ["circuit-params", "committed-instances"] }

[dev-dependencies]
group.workspace = true
rand.workspace = true
rand_chacha.workspace = true
serde_json.workspace = true
midnight-circuits.workspace = true
midnight-zk-stdlib.workspace = true
mori-recursion = { path = "../mori-recursion", features = ["sherlock-recursion"] }
mori-backend.workspace = true
mori-core.workspace = true
midnight-zkir-v3.workspace = true
midnight-transient-crypto.workspace = true
