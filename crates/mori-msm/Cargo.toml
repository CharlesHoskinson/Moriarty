[package]
name = "mori-msm"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "BLS12-381 G1 MSM for the Sherlock wrap prover in Rust (device code in kernel/, PTX for nvptx64)"
build = "build.rs"

[features]
default = []
# Build kernel/ to PTX and load it through the CUDA driver (cudarc).
cuda = ["dep:cudarc"]
# Tests and bench also compare with the sppark path of mori-gpu (needs nvcc).
sppark = ["cuda", "dep:mori-gpu"]

[dependencies]
cudarc = { version = "=0.19.10", default-features = false, features = ["std", "driver", "nvrtc", "cuda-version-from-build-system", "dynamic-loading"], optional = true }
midnight-curves = "=0.3.1"
blst = "=0.3.17"
ff = "=0.13.1"
group = "=0.13.0"
mori-gpu = { path = "../mori-gpu", features = ["cuda"], optional = true }

[dev-dependencies]
rand = "=0.8.8"
rand_chacha = "=0.3.1"

[[example]]
name = "bench"
required-features = ["cuda"]

[[example]]
name = "mulbench"
required-features = ["cuda"]
