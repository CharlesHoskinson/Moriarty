# GPU phase G0 toolchain smoke (task 2.10a, predicate F23). Needs CUDA (nvcc), so it
# is its own workspace and the root workspace excludes it. Run it through
# scripts/qa/check-f23.sh, not by hand in the main workspace.
[workspace]
resolver = "3"
members = ["."]

[package]
name = "mori-gpu-smoke"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
publish = false
build = "build.rs"

