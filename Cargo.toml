[workspace]
resolver = "3"
members = ["crates/*"]
# Standalone experiment and evidence crates keep their own builds, and
# crates/fixtures holds shared test programs, not a crate.
exclude = ["experiments", "raw", "wiki-llm", "deliverables", "crates/fixtures"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/CharlesHoskinson/Moriarty"

[workspace.dependencies]
mori-ast = { path = "crates/mori-ast" }
mori-backend = { path = "crates/mori-backend" }
mori-checker = { path = "crates/mori-checker" }
mori-core = { path = "crates/mori-core" }
mori-diagnostics = { path = "crates/mori-diagnostics" }
mori-fmt = { path = "crates/mori-fmt" }
mori-ledger = { path = "crates/mori-ledger" }
mori-lexer = { path = "crates/mori-lexer" }
mori-parser = { path = "crates/mori-parser" }
mori-source6 = { path = "crates/mori-source6" }
mori-span = { path = "crates/mori-span" }

# Midnight ledger crates, all from one pinned revision (tag ledger-9.1.0.1).
midnight-base-crypto = { git = "https://github.com/midnightntwrk/midnight-ledger", rev = "a2b30128ca4b660b73a068e29b56b48ede8c9a74" }
midnight-coin-structure = { git = "https://github.com/midnightntwrk/midnight-ledger", rev = "a2b30128ca4b660b73a068e29b56b48ede8c9a74" }
midnight-ledger = { git = "https://github.com/midnightntwrk/midnight-ledger", rev = "a2b30128ca4b660b73a068e29b56b48ede8c9a74", package = "midnight-ledger-v9" }
midnight-onchain-runtime = { git = "https://github.com/midnightntwrk/midnight-ledger", rev = "a2b30128ca4b660b73a068e29b56b48ede8c9a74" }
midnight-onchain-state = { git = "https://github.com/midnightntwrk/midnight-ledger", rev = "a2b30128ca4b660b73a068e29b56b48ede8c9a74" }
midnight-onchain-vm = { git = "https://github.com/midnightntwrk/midnight-ledger", rev = "a2b30128ca4b660b73a068e29b56b48ede8c9a74" }
midnight-serialize = { git = "https://github.com/midnightntwrk/midnight-ledger", rev = "a2b30128ca4b660b73a068e29b56b48ede8c9a74" }
midnight-storage = { git = "https://github.com/midnightntwrk/midnight-ledger", rev = "a2b30128ca4b660b73a068e29b56b48ede8c9a74" }
midnight-transient-crypto = { git = "https://github.com/midnightntwrk/midnight-ledger", rev = "a2b30128ca4b660b73a068e29b56b48ede8c9a74" }
# ZKIR v3 moved to its own repository; the ledger revision uses midnight-zkir 3.2.0
# at tag zkir-3.2.0. The workspace key keeps the old name so the code imports
# `midnight_zkir_v3` unchanged.
midnight-zkir-v3 = { git = "https://github.com/midnightntwrk/midnight-zkir", rev = "446c7fecc6bd41dab99ebe89ab404e9d077d11a9", package = "midnight-zkir" }
# Published crates that must match the versions the ledger revision uses.
midnight-curves = "=0.3.1"
midnight-proofs = "=0.8.3"
midnight-circuits = { version = "=7.3.0", default-features = false }
midnight-zk-stdlib = { version = "=2.4.0", default-features = false }
ff = "=0.13.1"
group = "=0.13.0"
hex = "=0.4.3"
num-bigint = "=0.4.8"
num-integer = "=0.1.47"
num-traits = "=0.2.19"
blake2b_simd = "=1.0.5"
rand_chacha = "=0.3.1"

anstream = "1.0.0"
anstyle = "1.0.14"
clap = { version = "4.6.7", features = ["derive"] }
futures = "=0.3.34"
ignore = "0.4.33"
indoc = "2.0.7"
insta = "1.49.0"
k256 = { version = "=0.13.4", features = ["schnorr", "ecdsa"] }
libc = "=0.2.190"
miette = { version = "7.6.0", default-features = false }
proptest = "1.11.0"
rand = "=0.8.8"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
similar = "2.7.0"
soa-rs = "1.0.1"
terminal_size = "0.4.4"
thiserror = "2.0.21"

# Faster snapshot diffing, as recommended by insta.
[profile.dev.package]
insta.opt-level = 3
similar.opt-level = 3

# Third-party crypto (midnight-proofs, circuits, curves, ff, group, ...) runs
# unoptimized under `cargo test` and made SDK circuit checks 10-50x slower
# (a workspace run took 8.1 h). `"*"` matches non-workspace crates only, so
# Moriarty's own crates keep fast incremental debug builds.
[profile.dev.package."*"]
opt-level = 3

# Mirror the pinned ledger's own workspace patches: midnight-zkir 3.2.0 asks
# crates.io for base-crypto, serialize and transient-crypto 3.x, which must
# unify with the ledger crates at the same immutable revision. The ledger's
# v2 compatibility path (`transient-crypto-old`, ^2.0.0) resolves to the
# published 2.2.0. No mutable local paths.
[patch.crates-io]
midnight-serialize = { git = "https://github.com/midnightntwrk/midnight-ledger", rev = "a2b30128ca4b660b73a068e29b56b48ede8c9a74" }
midnight-base-crypto = { git = "https://github.com/midnightntwrk/midnight-ledger", rev = "a2b30128ca4b660b73a068e29b56b48ede8c9a74" }
midnight-transient-crypto = { git = "https://github.com/midnightntwrk/midnight-ledger", rev = "a2b30128ca4b660b73a068e29b56b48ede8c9a74" }
midnight-storage-core = { git = "https://github.com/midnightntwrk/midnight-ledger", rev = "a2b30128ca4b660b73a068e29b56b48ede8c9a74" }
