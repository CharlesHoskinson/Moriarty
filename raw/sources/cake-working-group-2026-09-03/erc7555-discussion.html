        <div class="hidden" id="data-preloaded" data-preloaded="{&quot;topic_16536&quot;:&quot;{\&quot;post_stream\&quot;:{\&quot;posts\&quot;:[{\&quot;id\&quot;:42184,\&quot;name\&quot;:\&quot;Gregthegreek\&quot;,\&quot;username\&quot;:\&quot;greg\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/ethereum-magicians.org/greg/{size}/1603_2.png\&quot;,\&quot;created_at\&quot;:\&quot;2023-11-10T15:08:16.741Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eThis proposal establishes a standardized interface and functionality for applications to discover user addresses that may not be readily available from an EOA. Specifically discovering addresses and smart accounts that may have been deployed or configured using a signing key that is not the standard Ethereum secp256k1 curve. The objective is to ensure uniformity of address retrieval across applications, and domains.\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003ca href=\\\&quot;https://github.com/ethereum/ERCs/pull/99\\\&quot; class=\\\&quot;onebox\\\&quot; target=\\\&quot;_blank\\\&quot; rel=\\\&quot;noopener nofollow ugc\\\&quot;\\u003ehttps://github.com/ethereum/ERCs/pull/99\\u003c/a\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eNote: This EIP has an accompanying EIP \\u003ca href=\\\&quot;https://ethereum-magicians.org/t/erc-xxxx-embedded-accounts-as-smart-modules/16537\\\&quot;\\u003eEmbedded Accounts as Smart Modules\\u003c/a\\u003e, that extends the functionality of this one.\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:1,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:5,\&quot;updated_at\&quot;:\&quot;2024-08-02T16:37:22.868Z\&quot;,\&quot;reply_count\&quot;:0,\&quot;reply_to_post_number\&quot;:null,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:1291,\&quot;reads\&quot;:94,\&quot;readers_count\&quot;:93,\&quot;score\&quot;:6533.8,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:16536,\&quot;topic_slug\&quot;:\&quot;erc-7555-single-sign-on-for-account-discovery\&quot;,\&quot;display_username\&quot;:\&quot;Gregthegreek\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:4,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;link_counts\&quot;:[{\&quot;url\&quot;:\&quot;https://github.com/ethereum/ERCs/pull/99\&quot;,\&quot;internal\&quot;:false,\&quot;reflection\&quot;:false,\&quot;title\&quot;:\&quot;Add ERC: Single Sign-On for Account Discovery by GregTheGreek · Pull Request #99 · ethereum/ERCs · GitHub\&quot;,\&quot;clicks\&quot;:275},{\&quot;url\&quot;:\&quot;https://ethereum-magicians.org/t/erc-7556-embedded-accounts-as-smart-modules/16537\&quot;,\&quot;internal\&quot;:true,\&quot;reflection\&quot;:true,\&quot;title\&quot;:\&quot;ERC-7556: Embedded Accounts as Smart Modules\&quot;,\&quot;clicks\&quot;:3}],\&quot;read\&quot;:true,\&quot;user_title\&quot;:null,\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[{\&quot;id\&quot;:2,\&quot;count\&quot;:3}],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:752,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:2,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:true,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/erc-7555-single-sign-on-for-account-discovery/16536/1\&quot;,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:null,\&quot;can_vote\&quot;:false},{\&quot;id\&quot;:42202,\&quot;name\&quot;:\&quot;\&quot;,\&quot;username\&quot;:\&quot;mac\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/ethereum-magicians.org/mac/{size}/9953_2.png\&quot;,\&quot;created_at\&quot;:\&quot;2023-11-11T07:20:55.415Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eWebauthn (you call it passkey) does not force you to create anything – creating a public keypair (per origin) is just the tip of the iceberg, it can do so much more (prf, largeBlob, payment).\\u003c/p\\u003e\\n\\u003cp\\u003eIf you’re going to try to convince us to let centralized providers like walletconnect bring SSO to webwallets,  why aren’t they building it on the web standard FedCM?\\u003c/p\\u003e\\n\\u003cp\\u003eIt’s already in:\\u003cbr\\u003e\\nchromium\\u003cbr\\u003e\\nfirefox nightly\\u003cbr\\u003e\\nPositive signal from webkit\\u003c/p\\u003e\\n\\u003cp\\u003eIt survived the google-dreaded mozilla review, now offering a privacy preserving /login endpoint, and preventing RPs from enumerating user accounts.\\u003c/p\\u003e\\n\\u003cp\\u003eIt also makes it dumb-easy for RPs to implement, using credentials.get()\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cimg src=\\\&quot;https://ethereum-magicians.org/images/emoji/twitter/point_down.png?v=12\\\&quot; title=\\\&quot;:point_down:\\\&quot; class=\\\&quot;emoji only-emoji\\\&quot; alt=\\\&quot;:point_down:\\\&quot; loading=\\\&quot;lazy\\\&quot; width=\\\&quot;20\\\&quot; height=\\\&quot;20\\\&quot;\\u003e\\u003c/p\\u003e\\n\\u003caside class=\\\&quot;onebox githubblob\\\&quot; data-onebox-src=\\\&quot;https://github.com/fedidcg/FedCM/blob/main/explainer.md\\\&quot;\\u003e\\n  \\u003cheader class=\\\&quot;source\\\&quot;\\u003e\\n\\n      \\u003ca href=\\\&quot;https://github.com/fedidcg/FedCM/blob/main/explainer.md\\\&quot; target=\\\&quot;_blank\\\&quot; rel=\\\&quot;noopener nofollow ugc\\\&quot;\\u003egithub.com\\u003c/a\\u003e\\n  \\u003c/header\\u003e\\n\\n  \\u003carticle class=\\\&quot;onebox-body\\\&quot;\\u003e\\n    \\u003ch4\\u003e\\u003ca href=\\\&quot;https://github.com/fedidcg/FedCM/blob/main/explainer.md\\\&quot; target=\\\&quot;_blank\\\&quot; rel=\\\&quot;noopener nofollow ugc\\\&quot;\\u003efedidcg/FedCM/blob/main/explainer.md\\u003c/a\\u003e\\u003c/h4\\u003e\\n\\n\\n      \\u003cpre\\u003e\\u003ccode class=\\\&quot;lang-md\\\&quot;\\u003e# Federated Credential Management (FedCM)\\n**Last Update:** Mar 08, 2022\\n\\n## Introduction\\n\\nOver the last decade, identity federation has played a central role in raising\\nthe bar for authentication on the web, in terms of ease-of-use (e.g.\\npassword-less single sign-in), security (e.g. improved resistance to phishing\\nand credential stuffing attacks) and trustworthiness compared to per-site\\nusernames and passwords. In identity federation, a **RP (relying party)** relies\\non an **IDP (identity provider)** to provide the user an account without\\nrequiring a new username and password.\\n\\nUnfortunately, the mechanisms that identity federation was designed on (iframes,\\nredirects and cookies) are being abused to track users across the web. A user\\nagent isn’t able to differentiate between identity federation and tracking, the\\nmitigations for the various types of abuse make identity federation more\\ndifficult.\\n\\nThe Federated Credential Management API provides a use case specific abstraction\\n\\u003c/code\\u003e\\u003c/pre\\u003e\\n\\n\\n\\n  This file has been truncated. \\u003ca href=\\\&quot;https://github.com/fedidcg/FedCM/blob/main/explainer.md\\\&quot; target=\\\&quot;_blank\\\&quot; rel=\\\&quot;noopener nofollow ugc\\\&quot;\\u003eshow original\\u003c/a\\u003e\\n\\n  \\u003c/article\\u003e\\n\\n  \\u003cdiv class=\\\&quot;onebox-metadata\\\&quot;\\u003e\\n    \\n    \\n  \\u003c/div\\u003e\\n\\n  \\u003cdiv style=\\\&quot;clear: both\\\&quot;\\u003e\\u003c/div\\u003e\\n\\u003c/aside\\u003e\\n\\n\\u003cp\\u003eWe can do better here … \\u003cimg src=\\\&quot;https://ethereum-magicians.org/images/emoji/twitter/fairy.png?v=12\\\&quot; title=\\\&quot;:fairy:\\\&quot; class=\\\&quot;emoji\\\&quot; alt=\\\&quot;:fairy:\\\&quot; loading=\\\&quot;lazy\\\&quot; width=\\\&quot;20\\\&quot; height=\\\&quot;20\\\&quot;\\u003e\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:2,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:5,\&quot;updated_at\&quot;:\&quot;2023-11-11T07:50:21.458Z\&quot;,\&quot;reply_count\&quot;:1,\&quot;reply_to_post_number\&quot;:null,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:18,\&quot;reads\&quot;:82,\&quot;readers_count\&quot;:81,\&quot;score\&quot;:111.4,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:16536,\&quot;topic_slug\&quot;:\&quot;erc-7555-single-sign-on-for-account-discovery\&quot;,\&quot;display_username\&quot;:\&quot;\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:2,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;link_counts\&quot;:[{\&quot;url\&quot;:\&quot;https://github.com/fedidcg/FedCM/blob/main/explainer.md\&quot;,\&quot;internal\&quot;:false,\&quot;reflection\&quot;:false,\&quot;clicks\&quot;:15}],\&quot;read\&quot;:true,\&quot;user_title\&quot;:\&quot;\&quot;,\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:8648,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:1,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:true,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/erc-7555-single-sign-on-for-account-discovery/16536/2\&quot;,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:null},{\&quot;id\&quot;:42204,\&quot;name\&quot;:\&quot;Gregthegreek\&quot;,\&quot;username\&quot;:\&quot;greg\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/ethereum-magicians.org/greg/{size}/1603_2.png\&quot;,\&quot;created_at\&quot;:\&quot;2023-11-11T09:51:16.245Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003e\\u003ca class=\\\&quot;mention\\\&quot; href=\\\&quot;/u/mac\\\&quot;\\u003e@mac\\u003c/a\\u003e\\u003cbr\\u003e\\nThanks for flagging this!\\u003c/p\\u003e\\n\\u003cp\\u003eFirst things first. FedCM looks reaaaally good, and should be discussed in a wider context! Happy to facilitate!\\u003c/p\\u003e\\n\\u003cp\\u003eI want to make sure we’re using the same definitions, so let me articulate how I’ve described things, hopefully I haven’t missed something \\u003cimg src=\\\&quot;https://ethereum-magicians.org/images/emoji/twitter/slight_smile.png?v=12\\\&quot; title=\\\&quot;:slight_smile:\\\&quot; class=\\\&quot;emoji\\\&quot; alt=\\\&quot;:slight_smile:\\\&quot; loading=\\\&quot;lazy\\\&quot; width=\\\&quot;20\\\&quot; height=\\\&quot;20\\\&quot;\\u003e\\u003c/p\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cp\\u003eWebauthn (you call it passkey)\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003cp\\u003eWebauthn is specification for a browser based API for public key crpyto. You can \\u003cem\\u003ealmost\\u003c/em\\u003e related it to EIP-1193, in the same sense how does a browser communicate with a wallet. To be even more concrete, an iOS app deployed through the native app store \\u003cstrong\\u003edoes not\\u003c/strong\\u003e use webauthn when using passkeys, it will instead use the native \\u003ccode\\u003eASAuthorization APIs\\u003c/code\\u003e. When I say passkey, I’m referring to the curve p256.\\u003c/p\\u003e\\n\\u003cp\\u003eThe main reason I’m explicit about that differentiation is because this EIP in my opinion shouldn’t care \\u003cem\\u003ehow\\u003c/em\\u003e a key is generated, nor what type it is (theoretically you could be generating BLS keys for a user).\\u003c/p\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cp\\u003econvince us to let centralized providers like walletconnect bring SSO\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003cp\\u003eSo I actually would prefer people not use them! Let me articulate how. The provider side logic needed to \\u003cem\\u003ediscover\\u003c/em\\u003e and \\u003cem\\u003erespond\\u003c/em\\u003e back to an application should be stateless. Meaning you shouldn’t need an centralized server what so ever to do anything for you, a website with an IPFS hash is sufficient.\\u003c/p\\u003e\\n\\u003cp\\u003e(fwii @ ChainSafe we’re working on this demo should have it at somepoint early next week)\\u003cbr\\u003e\\nLet’s imagine web3modal, it now hows a text box that says “enter url”, that url can be \\u003cstrong\\u003eanything\\u003c/strong\\u003e, native ios/android app deep linking, a website, localhost, it doesn’t matter. In this case, I will say its \\u003ca href=\\\&quot;http://sso.gregthegreek.com\\\&quot; rel=\\\&quot;noopener nofollow ugc\\\&quot;\\u003esso.gregthegreek.com\\u003c/a\\u003e (doesn’t exist), my personal website. On this website, I have implemented:\\u003c/p\\u003e\\n\\u003cul\\u003e\\n\\u003cli\\u003ePasskey (via Webauthn)\\u003c/li\\u003e\\n\\u003cli\\u003eWeb3modal (for injected browser wallets, like metamask)\\u003c/li\\u003e\\n\\u003cli\\u003eNative Ledger support\\u003cbr\\u003e\\nOn this website, I can select any of the above options to determine a public address that I want to use for the app I was previously on. Once I’ve selected a “login” option, the website automatically knows how to “discover” if that public key has an associated smart contract wallet, perhaps via \\u003ccode\\u003ecreate2\\u003c/code\\u003e. Per ERC-7555 I would respond with all that information.\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003cp\\u003eAs you can see, this ERC allows support of any signing algo. It also isn’t opinionated on what tech to use. The redirect in my example above using web3modal (walletconnect) you can completely skip that! You can just have a list of url’s and call \\u003ccode\\u003ewindow.location.redirect(url)\\u003c/code\\u003e and never even show any third parties!\\u003c/p\\u003e\\n\\u003cp\\u003eThis ERC extends the possibility of decentralizing 4337 wallet creation, and utilization which is currently heavily gated by APIs. The same way running a dappnode at home, and setting that as a custom RPC decentralizes you away from centralized RPC providers.\\u003c/p\\u003e\\n\\u003cp\\u003eI hope that helps explain things a bit better, I love criticism, so lets keep finding holes.\\u003c/p\\u003e\\n\\u003cp\\u003eI think using FedCM would probably need to be an effort discussed within the 4337 community more widely.\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:3,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:5,\&quot;updated_at\&quot;:\&quot;2023-11-11T10:00:52.809Z\&quot;,\&quot;reply_count\&quot;:0,\&quot;reply_to_post_number\&quot;:2,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:42,\&quot;reads\&quot;:59,\&quot;readers_count\&quot;:58,\&quot;score\&quot;:221.8,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:16536,\&quot;topic_slug\&quot;:\&quot;erc-7555-single-sign-on-for-account-discovery\&quot;,\&quot;display_username\&quot;:\&quot;Gregthegreek\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:2,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;link_counts\&quot;:[{\&quot;url\&quot;:\&quot;http://sso.gregthegreek.com\&quot;,\&quot;internal\&quot;:false,\&quot;reflection\&quot;:false,\&quot;clicks\&quot;:5}],\&quot;read\&quot;:true,\&quot;user_title\&quot;:null,\&quot;reply_to_user\&quot;:{\&quot;id\&quot;:8648,\&quot;username\&quot;:\&quot;mac\&quot;,\&quot;name\&quot;:\&quot;\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/ethereum-magicians.org/mac/{size}/9953_2.png\&quot;},\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:752,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:2,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:true,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/erc-7555-single-sign-on-for-account-discovery/16536/3\&quot;,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:null},{\&quot;id\&quot;:42208,\&quot;name\&quot;:\&quot;\&quot;,\&quot;username\&quot;:\&quot;dror\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/ethereum-magicians.org/dror/{size}/2438_2.png\&quot;,\&quot;created_at\&quot;:\&quot;2023-11-11T21:15:22.562Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eI have a problem with the basic assumption of this ERC:\\u003cbr\\u003e\\nIt assumes that for every signing key (public key over some curve), there exists a single smart contact account address.\\u003cbr\\u003e\\nIt attempts to copy the same basic trait from EOA accounts, where the account address is derived from the public key.\\u003c/p\\u003e\\n\\u003cp\\u003eHowever, this completely ignores the major feature of smart accounts, which is the ability to \\u003cem\\u003echange\\u003c/em\\u003e the keys: once created, an account can change its keys.\\u003cbr\\u003e\\nAnother major feature of smart accounts is that the account is defined by much more than the signing key.\\u003cbr\\u003e\\nEven if the account is modular, the address of the account is defined by the actual initial deployed modules, which again, defines much more than the signature method.\\u003c/p\\u003e\\n\\u003cp\\u003eThe bottom line is that the signing key is just one of many parameters needed to define the account address, and I strongly recommend NOT relying on it at all as a unique identifier.\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:4,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:5,\&quot;updated_at\&quot;:\&quot;2023-11-11T21:15:22.562Z\&quot;,\&quot;reply_count\&quot;:1,\&quot;reply_to_post_number\&quot;:null,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:16,\&quot;reads\&quot;:48,\&quot;readers_count\&quot;:47,\&quot;score\&quot;:109.6,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:16536,\&quot;topic_slug\&quot;:\&quot;erc-7555-single-sign-on-for-account-discovery\&quot;,\&quot;display_username\&quot;:\&quot;\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;read\&quot;:true,\&quot;user_title\&quot;:\&quot;\&quot;,\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[{\&quot;id\&quot;:2,\&quot;count\&quot;:1}],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:1677,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:1,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:true,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/erc-7555-single-sign-on-for-account-discovery/16536/4\&quot;,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:null},{\&quot;id\&quot;:42209,\&quot;name\&quot;:\&quot;Gregthegreek\&quot;,\&quot;username\&quot;:\&quot;greg\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/ethereum-magicians.org/greg/{size}/1603_2.png\&quot;,\&quot;created_at\&quot;:\&quot;2023-11-11T21:39:54.634Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003caside class=\\\&quot;quote no-group\\\&quot; data-username=\\\&quot;dror\\\&quot; data-post=\\\&quot;4\\\&quot; data-topic=\\\&quot;16536\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;title\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;quote-controls\\\&quot;\\u003e\\u003c/div\\u003e\\n\\u003cimg loading=\\\&quot;lazy\\\&quot; alt=\\\&quot;\\\&quot; width=\\\&quot;24\\\&quot; height=\\\&quot;24\\\&quot; src=\\\&quot;https://ethereum-magicians.org/user_avatar/ethereum-magicians.org/dror/48/2438_2.png\\\&quot; class=\\\&quot;avatar\\\&quot;\\u003e dror:\\u003c/div\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cp\\u003eAnother major feature of smart accounts is that the account is defined by much more than the signing key.\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003c/aside\\u003e\\n\\u003cp\\u003eEverything you mention makes sense and I believe is well covered in this ERC.\\u003c/p\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cp\\u003eIt attempts to copy the same basic trait from EOA accounts, where the account address is derived from the public key.\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003cp\\u003eNot exactly, it’s up to the 4337 provider to determine \\u003cem\\u003ehow\\u003c/em\\u003e to find the smart contract wallet. A single credential can have \\u003cem\\u003emany\\u003c/em\\u003e SCWs, and a 4337 provider should display all known wallets it has access to.\\u003c/p\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cp\\u003eThe bottom line is that the signing key is just one of many parameters needed to define the account address, and I strongly recommend NOT relying on it at all as a unique identifier.\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003cp\\u003eAs I brought up before, I don’t think that we’re explicitly saying a 4337 provider has to use a signing key as the unique parameter. The ERC explicitly doesn’t care about what a provider does to recover the SCW address, there could be a multitude of varying parameters on how to recover it. For example:\\u003cbr\\u003e\\nA provider could have google-auth, and uses a database to keep track of deployments, they can also track ownership changes and maintain a clean history for the end-user. In this example, on-redirect, the user is prompted via google auth, they do a lookup in the db, then return the SCW address and signing key. Furthermore, imagine the signing key was a passkey, in this example the end user never even needs to be prompted for their passkey. Now this might not be an ideal or good practice for handling it, but its 100% possible and articulates how non opinionated this ERC is.\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:5,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:5,\&quot;updated_at\&quot;:\&quot;2023-11-11T21:39:54.634Z\&quot;,\&quot;reply_count\&quot;:0,\&quot;reply_to_post_number\&quot;:4,\&quot;quote_count\&quot;:1,\&quot;incoming_link_count\&quot;:27,\&quot;reads\&quot;:53,\&quot;readers_count\&quot;:52,\&quot;score\&quot;:175.6,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:16536,\&quot;topic_slug\&quot;:\&quot;erc-7555-single-sign-on-for-account-discovery\&quot;,\&quot;display_username\&quot;:\&quot;Gregthegreek\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;read\&quot;:true,\&quot;user_title\&quot;:null,\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[{\&quot;id\&quot;:2,\&quot;count\&quot;:2}],\&quot;moderator de specific comments on this forum, timestamped audio/video exchanges, formal audits, or other external resources. This section should be the go-to for readers to understand the community&#39;s current assessment of the EIP. Aim for neutrality, quality \\u0026 thoroughness over \\\&quot;cherry-picking\\\&quot; the most favorable reviews. \\n\\u003e \\n\\u003e The recommended format for entries is: \\n\\u003e \\n\\u003e * yyyy-mm-dd: Single sentence description, [link to review]()\\n\\u003e \\n\\u003e For example, using EIP-1559, one entry could be:\\n\\u003e * 2020-12-01: \\\&quot;An Economic Analysis of EIP-1559\\\&quot;, by Tim Roughgarden, [full report](https://timroughgarden.org/papers/eip1559.pdf)\\n\\nNone as of yyyy-mm-dd.\\n\\n#### Outstanding Issues \\n\\n\\u003e This section should highlight outstanding issues about the EIP, and, if possible, link to forums where these are being addressed. This section should allow readers to quickly understand what the most important TODOs for the EIP are, and how to best contribute. Once issues are resolved, they should be checked off with a note giving context on the resolution. \\n\\u003e \\n\\u003e The recommended format for new entries is: \\n\\u003e * [ ] yyyy-mm-dd: Issue description, [link to issue]()\\n\\u003e\\n\\u003e Once issues are addressed, these becomes: \\n\\u003e * [x] yyyy-mm-dd: Issue description, [link to issue]()\\n\\u003e     * yyyy-mm-dd: Resolution description, [link to resolution]()\\n\\u003e \\n\\u003e For example, using EIP-3675, one entry could be: \\n\\u003e * [x] 2021-07-08: Repurpose the `DIFFICULTY` opcode, [tracking issue](https://github.com/ethereum/pm/commit/496b4dc9bcb76e5290f5cc5d52d7424ae75a4f96)\\n\\u003e     * 2021-10-30: Introduce EIP-4399, [EIP PR](https://github.com/ethereum/EIPs/pull/4399)\\n\\u003e\\n\\u003e If there are any known outstanding issues currently, fill them out now.\\n\\nNone as of yyyy-mm-dd.\&quot;,\&quot;has_children\&quot;:false,\&quot;subcategory_count\&quot;             <div class='post' itemprop='text'>
              <p>This proposal establishes a standardized interface and functionality for applications to discover user addresses that may not be readily available from an EOA. Specifically discovering addresses and smart accounts that may have been deployed or configured using a signing key that is not the standard Ethereum secp256k1 curve. The objective is to ensure uniformity of address retrieval across applications, and domains.</p>
<p><a href="https://github.com/ethereum/ERCs/pull/99" class="onebox" target="_blank" rel="noopener nofollow ugc">https://github.com/ethereum/ERCs/pull/99</a></p>
<p>Note: This EIP has an accompanying EIP <a href="https://ethereum-magicians.org/t/erc-xxxx-embedded-accounts-as-smart-modules/16537">Embedded Accounts as Smart Modules</a>, that extends the functionality of this one.</p>
            </div>

            <div class='post' itemprop='text'>
              <p>Webauthn (you call it passkey) does not force you to create anything – creating a public keypair (per origin) is just the tip of the iceberg, it can do so much more (prf, largeBlob, payment).</p>
<p>If you’re going to try to convince us to let centralized providers like walletconnect bring SSO to webwallets,  why aren’t they building it on the web standard FedCM?</p>
<p>It’s already in:<br>
chromium<br>
firefox nightly<br>
Positive signal from webkit</p>
<p>It survived the google-dreaded mozilla review, now offering a privacy preserving /login endpoint, and preventing RPs from enumerating user accounts.</p>
<p>It also makes it dumb-easy for RPs to implement, using credentials.get()</p>
<p><img src="https://ethereum-magicians.org/images/emoji/twitter/point_down.png?v=12" title=":point_down:" class="emoji only-emoji" alt=":point_down:" loading="lazy" width="20" height="20"></p>

      <pre><code class="lang-md"># Federated Credential Management (FedCM)
**Last Update:** Mar 08, 2022

## Introduction

Over the last decade, identity federation has played a central role in raising
the bar for authentication on the web, in terms of ease-of-use (e.g.
password-less single sign-in), security (e.g. improved resistance to phishing
and credential stuffing attacks) and trustworthiness compared to per-site
usernames and passwords. In identity federation, a **RP (relying party)** relies
on an **IDP (identity provider)** to provide the user an account without
requiring a new username and password.

Unfortunately, the mechanisms that identity federation was designed on (iframes,
redirects and cookies) are being abused to track users across the web. A user
agent isn’t able to differentiate between identity federation and tracking, the
mitigations for the various types of abuse make identity federation more
difficult.

The Federated Credential Management API provides a use case specific abstraction

<p>We can do better here … <img src="https://ethereum-magicians.org/images/emoji/twitter/fairy.png?v=12" title=":fairy:" class="emoji" alt=":fairy:" loading="lazy" width="20" height="20"></p>

            <div class='post' itemprop='text'>
              <p><a class="mention" href="/u/mac">@mac</a><br>
Thanks for flagging this!</p>
<p>First things first. FedCM looks reaaaally good, and should be discussed in a wider context! Happy to facilitate!</p>
<p>I want to make sure we’re using the same definitions, so let me articulate how I’ve described things, hopefully I haven’t missed something <img src="https://ethereum-magicians.org/images/emoji/twitter/slight_smile.png?v=12" title=":slight_smile:" class="emoji" alt=":slight_smile:" loading="lazy" width="20" height="20"></p>
<blockquote>
<p>Webauthn (you call it passkey)</p>
</blockquote>
<p>Webauthn is specification for a browser based API for public key crpyto. You can <em>almost</em> related it to EIP-1193, in the same sense how does a browser communicate with a wallet. To be even more concrete, an iOS app deployed through the native app store <strong>does not</strong> use webauthn when using passkeys, it will instead use the native <code>ASAuthorization APIs</code>. When I say passkey, I’m referring to the curve p256.</p>
<p>The main reason I’m explicit about that differentiation is because this EIP in my opinion shouldn’t care <em>how</em> a key is generated, nor what type it is (theoretically you could be generating BLS keys for a user).</p>
<blockquote>
<p>convince us to let centralized providers like walletconnect bring SSO</p>
</blockquote>
<p>So I actually would prefer people not use them! Let me articulate how. The provider side logic needed to <em>discover</em> and <em>respond</em> back to an application should be stateless. Meaning you shouldn’t need an centralized server what so ever to do anything for you, a website with an IPFS hash is sufficient.</p>
<p>(fwii @ ChainSafe we’re working on this demo should have it at somepoint early next week)<br>
Let’s imagine web3modal, it now hows a text box that says “enter url”, that url can be <strong>anything</strong>, native ios/android app deep linking, a website, localhost, it doesn’t matter. In this case, I will say its <a href="http://sso.gregthegreek.com" rel="noopener nofollow ugc">sso.gregthegreek.com</a> (doesn’t exist), my personal website. On this website, I have implemented:</p>
<ul>
<li>Passkey (via Webauthn)</li>
<li>Web3modal (for injected browser wallets, like metamask)</li>
<li>Native Ledger support<br>
On this website, I can select any of the above options to determine a public address that I want to use for the app I was previously on. Once I’ve selected a “login” option, the website automatically knows how to “discover” if that public key has an associated smart contract wallet, perhaps via <code>create2</code>. Per ERC-7555 I would respond with all that information.</li>
</ul>
<p>As you can see, this ERC allows support of any signing algo. It also isn’t opinionated on what tech to use. The redirect in my example above using web3modal (walletconnect) you can completely skip that! You can just have a list of url’s and call <code>window.location.redirect(url)</code> and never even show any third parties!</p>
<p>This ERC extends the possibility of decentralizing 4337 wallet creation, and utilization which is currently heavily gated by APIs. The same way running a dappnode at home, and setting that as a custom RPC decentralizes you away from centralized RPC providers.</p>
<p>I hope that helps explain things a bit better, I love criticism, so lets keep finding holes.</p>
<p>I think using FedCM would probably need to be an effort discussed within the 4337 community more widely.</p>

            <div class='post' itemprop='text'>
              <p>I have a problem with the basic assumption of this ERC:<br>
It assumes that for every signing key (public key over some curve), there exists a single smart contact account address.<br>
It attempts to copy the same basic trait from EOA accounts, where the account address is derived from the public key.</p>
<p>However, this completely ignores the major feature of smart accounts, which is the ability to <em>change</em> the keys: once created, an account can change its keys.<br>
Another major feature of smart accounts is that the account is defined by much more than the signing key.<br>
Even if the account is modular, the address of the account is defined by the actual initial deployed modules, which again, defines much more than the signature method.</p>
<p>The bottom line is that the signing key is just one of many parameters needed to define the account address, and I strongly recommend NOT relying on it at all as a unique identifier.</p>
            </div>

              <aside class="quote no-group" data-username="dror" data-post="4" data-topic="16536">
<div class="title">
<div class="quote-controls"></div>
<img loading="lazy" alt="" width="24" height="24" src="https://ethereum-magicians.org/user_avatar/ethereum-magicians.org/dror/48/2438_2.png" class="avatar"> dror:</div>
<blockquote>
<p>Another major feature of smart accounts is that the account is defined by much more than the signing key.</p>
</blockquote>
</aside>
<p>Everything you mention makes sense and I believe is well covered in this ERC.</p>
<blockquote>
<p>It attempts to copy the same basic trait from EOA accounts, where the account address is derived from the public key.</p>
</blockquote>
<p>Not exactly, it’s up to the 4337 provider to determine <em>how</em> to find the smart contract wallet. A single credential can have <em>many</em> SCWs, and a 4337 provider should display all known wallets it has access to.</p>
<blockquote>
<p>The bottom line is that the signing key is just one of many parameters needed to define the account address, and I strongly recommend NOT relying on it at all as a unique identifier.</p>
</blockquote>
<p>As I brought up before, I don’t think that we’re explicitly saying a 4337 provider has to use a signing key as the unique parameter. The ERC explicitly doesn’t care about what a provider does to recover the SCW address, there could be a multitude of varying parameters on how to recover it. For example:<br>
A provider could have google-auth, and uses a database to keep track of deployments, they can also track ownership changes and maintain a clean history for the end-user. In this example, on-redirect, the user is prompted via google auth, they do a lookup in the db, then return the SCW address and signing key. Furthermore, imagine the signing key was a passkey, in this example the end user never even needs to be prompted for their passkey. Now this might not be an ideal or good practice for handling it, but its 100% possible and articulates how non opinionated this ERC is.</p>
            </div>
