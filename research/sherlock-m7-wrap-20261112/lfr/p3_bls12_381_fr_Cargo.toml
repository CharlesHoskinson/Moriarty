[package]
edition = "2021"
name = "p3-bls12-381-fr"
version = "0.4.3"
description = "Plonky3 0.4.3 field type for the BLS12-381 scalar field Fr, wrapping midnight_curves::Fq (Sherlock M7)"
license = "MIT OR Apache-2.0"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
p3-field = "0.4.3"
num-bigint = { version = "0.4.3", default-features = false }
rand = { version = "0.9.0", default-features = false, features = ["small_rng"] }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
ff = "0.13"
midnight-curves = "0.3.1"
