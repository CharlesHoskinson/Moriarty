name = "compact_compilation_oracle"
defaultTargets = ["CompactComp", "oracle"]

[[require]]
name = "sherlock_codec"
path = "../../codec"

# Every module under CompactComp/ (Spec, Tests and the axiom Audit) builds by default,
# so `lake build --wfail` sees a `sorry` in any of them.
[[lean_lib]]
name = "CompactComp"
globs = ["CompactComp.+"]

[[lean_exe]]
name = "oracle"
root = "Main"
supportInterpreter = false
