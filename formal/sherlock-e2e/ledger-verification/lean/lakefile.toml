name = "ledger_verification_oracle"
defaultTargets = ["LedgerVerification", "oracle"]

[[require]]
name = "sherlock_codec"
path = "../../codec"

# Every module under LedgerVerification/ (Spec, Tests and the axiom Audit) builds by default,
# so `lake build --wfail` sees a `sorry` in any of them.
[[lean_lib]]
name = "LedgerVerification"
globs = ["LedgerVerification.+"]

[[lean_exe]]
name = "oracle"
root = "Main"
supportInterpreter = false
