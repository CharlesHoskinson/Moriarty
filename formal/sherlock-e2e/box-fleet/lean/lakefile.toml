name = "box_fleet_oracle"
defaultTargets = ["BoxFleet", "oracle"]

[[require]]
name = "sherlock_codec"
path = "../../codec-lean"

# Every module under BoxFleet/ (Spec, Constants, Tests, Audit) builds by default,
# so `lake build --wfail` sees a `sorry` in any of them.
[[lean_lib]]
name = "BoxFleet"
globs = ["BoxFleet.+"]

[[lean_exe]]
name = "oracle"
root = "Main"
supportInterpreter = false
