name = "aggregation_oracle"
defaultTargets = ["Aggregation", "oracle"]

[[require]]
name = "sherlock_codec_b"
path = "../../codec-lean"

# Every module under Aggregation/ (Spec, Constants, Tests, Audit) builds by default,
# so `lake build --wfail` sees a `sorry` in any of them.
[[lean_lib]]
name = "Aggregation"
globs = ["Aggregation.+"]

[[lean_exe]]
name = "oracle"
root = "Main"
supportInterpreter = false
