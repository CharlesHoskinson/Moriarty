name = "bridge_oracle"
defaultTargets = ["Bridge", "oracle"]

[[require]]
name = "sherlock_codec_b"
path = "../../codec-lean"

# Every module under Bridge/ (Spec, Constants, Tests, Audit) builds by default,
# so `lake build --wfail` sees a `sorry` in any of them.
[[lean_lib]]
name = "Bridge"
globs = ["Bridge.+"]

[[lean_exe]]
name = "oracle"
root = "Main"
supportInterpreter = false
