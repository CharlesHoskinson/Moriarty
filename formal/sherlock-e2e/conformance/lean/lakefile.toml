name = "conformance_oracle"
defaultTargets = ["Conformance", "oracle"]

[[require]]
name = "sherlock_codec"
path = "../../codec"

# Every module under Conformance/ (Spec, Tests and the axiom Audit) builds by default,
# so `lake build --wfail` sees a `sorry` in any of them.
[[lean_lib]]
name = "Conformance"
globs = ["Conformance.+"]

[[lean_exe]]
name = "oracle"
root = "Main"
supportInterpreter = false
