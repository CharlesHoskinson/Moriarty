name = "placement_oracle"
defaultTargets = ["Placement", "oracle"]

[[require]]
name = "sherlock_codec"
path = "../../codec"

# Every module under Placement/ builds by default, so `lake build --wfail` sees a
# `sorry` in any of them.
[[lean_lib]]
name = "Placement"
globs = ["Placement.+"]

[[lean_exe]]
name = "oracle"
root = "Main"
supportInterpreter = false
