name = "leaf_proving_oracle"
defaultTargets = ["LeafProving", "oracle"]

[[require]]
name = "sherlock_codec"
path = "../../codec-lean"

# Every module under LeafProving/ (Spec, Constants, Tests, Audit) builds by default,
# so `lake build --wfail` sees a `sorry` in any of them.
[[lean_lib]]
name = "LeafProving"
globs = ["LeafProving.+"]

[[lean_exe]]
name = "oracle"
root = "Main"
supportInterpreter = false
