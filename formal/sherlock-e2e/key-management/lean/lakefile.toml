name = "key_management_oracle"
defaultTargets = ["KeyManagement", "oracle"]

[[require]]
name = "sherlock_codec"
path = "../../codec-lean"

# Every module under KeyManagement/ (Spec, Constants, Tests, Audit) builds by default,
# so `lake build --wfail` sees a `sorry` in any of them.
[[lean_lib]]
name = "KeyManagement"
globs = ["KeyManagement.+"]

[[lean_exe]]
name = "oracle"
root = "Main"
supportInterpreter = false
