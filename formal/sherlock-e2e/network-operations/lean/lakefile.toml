name = "network_operations_oracle"
defaultTargets = ["NetworkOps", "oracle"]

[[require]]
name = "sherlock_codec"
path = "../../codec"

# Every module under NetworkOps/ (Spec, Tests and the axiom Audit) builds by default,
# so `lake build --wfail` sees a `sorry` in any of them.
[[lean_lib]]
name = "NetworkOps"
globs = ["NetworkOps.+"]

[[lean_exe]]
name = "oracle"
root = "Main"
supportInterpreter = false
