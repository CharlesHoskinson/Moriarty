name = "call_flow_oracle"
defaultTargets = ["CallFlow", "oracle"]

[[require]]
name = "sherlock_codec"
path = "../../codec"

# Every module under CallFlow/ (Spec, Tests and the axiom Audit) builds by default,
# so `lake build --wfail` sees a `sorry` in any of them.
[[lean_lib]]
name = "CallFlow"
globs = ["CallFlow.+"]

[[lean_exe]]
name = "oracle"
root = "Main"
supportInterpreter = false
