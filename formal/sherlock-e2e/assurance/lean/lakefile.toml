name = "assurance_oracle"
defaultTargets = ["Assurance", "oracle"]

[[require]]
name = "sherlock_codec_b"
path = "../../codec-lean"

# Every module under Assurance/ (Spec, Constants, Tests, Audit) builds by default,
# so `lake build --wfail` sees a `sorry` in any of them.
[[lean_lib]]
name = "Assurance"
globs = ["Assurance.+"]

[[lean_exe]]
name = "oracle"
root = "Main"
supportInterpreter = false
