name = "governance_oracle"
defaultTargets = ["Governance", "oracle"]

[[require]]
name = "sherlock_codec"
path = "../../codec"

# Every module under Governance/ builds by default, so `lake build --wfail` sees a
# `sorry` in any of them.
[[lean_lib]]
name = "Governance"
globs = ["Governance.+"]

[[lean_exe]]
name = "oracle"
root = "Main"
supportInterpreter = false
