name = "wrap_oracle"
defaultTargets = ["Wrap", "oracle"]

[[require]]
name = "sherlock_codec"
path = "../../codec"

# Every module under Wrap/ (Spec, Tests and the axiom Audit) builds by default,
# so `lake build --wfail` sees a `sorry` in any of them.
[[lean_lib]]
name = "Wrap"
globs = ["Wrap.+"]

[[lean_exe]]
name = "oracle"
root = "Main"
supportInterpreter = false
