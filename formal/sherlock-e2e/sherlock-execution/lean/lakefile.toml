name = "sherlock_exec_oracle"
defaultTargets = ["SherlockExec", "oracle"]

[[require]]
name = "sherlock_codec"
path = "../../codec"

# Every module under SherlockExec/ (Spec, Tests, Consistency, Audit) builds by default.
[[lean_lib]]
name = "SherlockExec"
globs = ["SherlockExec.+"]

[[lean_exe]]
name = "oracle"
root = "Main"
supportInterpreter = false
