name = "scheduling_oracle"
defaultTargets = ["Scheduling", "oracle"]

[[require]]
name = "sherlock_codec"
path = "../../codec-lean"

# Every module under Scheduling/ (Spec, Constants, Tests, Audit) builds by default,
# so `lake build --wfail` sees a `sorry` in any of them.
[[lean_lib]]
name = "Scheduling"
globs = ["Scheduling.+"]

[[lean_exe]]
name = "oracle"
root = "Main"
supportInterpreter = false
