name = "settlement_oracle"
defaultTargets = ["Settlement", "oracle"]

[[require]]
name = "sherlock_codec"
path = "../../codec"

# Every module under Settlement/ (Spec, Tests and the axiom Audit) builds by default,
# so `lake build --wfail` sees a `sorry` in any of them.
[[lean_lib]]
name = "Settlement"
globs = ["Settlement.+"]

[[lean_exe]]
name = "oracle"
root = "Main"
supportInterpreter = false
