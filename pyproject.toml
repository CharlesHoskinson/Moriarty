[project]
name = "moriarty"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "scrapling[fetchers,rag]>=0.4.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "graphifyy==0.9.53",
    "pytest>=9.0.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = [
    "tests",
    "experiments/moriarty-compact-escrow",
]
