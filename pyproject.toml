    "scrapling[fetchers,rag]>=0.4.15",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = [
    "tests",
    "experiments/moriarty-compact-escrow",
]
