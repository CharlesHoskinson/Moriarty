[project]
name = "moriarty"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "scrapling[fetchers,rag]>=0.4.15",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "graphifyy==0.9.53",
    "jsonschema>=4.25,<5",
    "pytest>=9.0.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = [
    "tests",
]
